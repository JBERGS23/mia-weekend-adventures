  {id:'w20260802_4',title:'NYC Public Pools — August Heat Escape',desc:'The free city pools are the move. Red Hook and Sunset Park pools have toddler-friendly shallow areas.',timing:'Sun Aug 2 | Opens 11am',location:'Red Hook Pool or Sunset Park Pool',distance:'15–25 min',source:'NYC Parks',sourceUrl:'https://www.nycgovparks.org/',imageUrl:'',day:'2026-08-02',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260802_5',title:'Governors Island — Sunday on the Harbor',desc:'The Yard playground for Mia, art installations, food vendors, harbor breezes.',timing:'Sun Aug 2 | Opens 7am',location:'Governors Island — ferry from Pier 6 or Red Hook',distance:'20 min',source:'Governors Island',sourceUrl:'https://www.govisland.com/',imageUrl:'',day:'2026-08-02',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260808_1',title:"BRIC Celebrate Brooklyn: Aaliyah 'One in a Million' Tribute",desc:"Free massive tribute concert celebrating Aaliyah's iconic 1996 album at the Prospect Park Bandshell. Get there early for a good lawn spot — the grass at the back is the toddler-friendly zone.",timing:'Sat Aug 8 | 7pm',location:'Prospect Park Lena Horne Bandshell, Brooklyn',distance:'20 min',source:'BRIC Celebrate Brooklyn',sourceUrl:'https://bricartsmedia.org/celebrate-brooklyn/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2025/07/celebrate-brooklyn-joe-buglewicz-1274__x_large-800x600.jpg',day:'2026-08-08',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260808_6',title:'Hong Kong Dragon Boat Festival — 36th Year',desc:'More than 180 racing teams paddle Meadow Lake in one of the biggest multicultural festivals in the country. Mia can watch the drums and boats right from the shore, then wander lion dance, martial arts demos, and international food stalls. Free, rain or shine.',timing:'Sat Aug 8 | 9am into the early evening',location:'Meadow Lake, Flushing Meadows Corona Park, Queens',distance:'~45 min',source:'New York Family',sourceUrl:'https://www.hkdbf-ny.org/',imageUrl:'',day:'2026-08-08',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260808_3',title:'Hindu Aarti Lamp Ceremony at Pebble Beach',desc:'Dance artist and educator Aeilushi Mistry performs the traditional Hindu Aarti ceremony on the banks of the East River — a serene, visually stunning ritual of fire, flowers, and prayer, with a chance for the public to make a blessing.',timing:'Sat Aug 8 | 5:00–7:30pm',location:'Pebble Beach, Brooklyn Bridge Park',distance:'15 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/event/hindu-lamp-ceremony/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Hindu-Lamp-Festival-Etienne-Frossard.jpg',day:'2026-08-08',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260808_7',title:'Fort Greene STEAM Fair — Free Science + Art for Kids',desc:'STEAMVentures returns to Fort Greene Park for the second annual STEAM Fair. Mia can make solar-powered animals, reveal invisible-ink messages, do scratch art, and decorate lightning bugs. Free, hands-on, all ages, and a short hop from Downtown Brooklyn.',timing:'Sat Aug 8 | 10am–1pm',location:'Fort Greene Park, Brooklyn',distance:'10 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/free-kid-friendly-events-this-week-in-brooklyn-8-3-8-9/',imageUrl:'',day:'2026-08-08',category:'arts',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260808_8',title:'Summer Streets — Car-Free Manhattan',desc:"Nearly eight miles of car-free streets from the Brooklyn Bridge up through Harlem and Inwood. Free fitness classes, DJ sets, interactive art, and The Bower shade structure where kids chalk-draw. Bring Mia's scooter or balance bike — this is the one day a year Park Avenue belongs to toddlers.",timing:'Sat Aug 8 | 7am–3pm',location:'Brooklyn Bridge → East Harlem / Inwood, Manhattan',distance:'10 min to the Brooklyn Bridge start',source:'NYC DOT / Mommy Poppins',sourceUrl:'https://nyc.gov/summerstreets',imageUrl:'',day:'2026-08-08',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260809_1',title:'NY Liberty vs Las Vegas Aces',desc:"One of the marquee WNBA matchups of the season, ten minutes from home at Barclays Center. The 12:30pm tipoff is perfect for Mia — done well before nap time falls apart.",timing:'Sun Aug 9 | 12:30pm ET',location:'Barclays Center, 620 Atlantic Ave, Downtown Brooklyn',distance:'10 min',source:'NY Liberty',sourceUrl:'https://liberty.wnba.com/schedule',imageUrl:'',day:'2026-08-09',category:'sports',tags:['indoor','toddler-friendly']},
  {id:'w20260809_6',title:'Hong Kong Dragon Boat Festival — Day 2',desc:'Sunday is finals day on Meadow Lake, so the racing is at its most dramatic. Traditional dance, martial arts, and food from all over Asia around the lakeside. Free admission, and easier to find shade in the afternoon.',timing:'Sun Aug 9 | 9am into the early evening',location:'Meadow Lake, Flushing Meadows Corona Park, Queens',distance:'~45 min',source:'New York Family',sourceUrl:'https://www.hkdbf-ny.org/',imageUrl:'',day:'2026-08-09',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260809_7',title:'Community & Family Day at Brooklyn Army Terminal',desc:'A free waterfront family day on the 59-acre Brooklyn Army Terminal campus — activities, live entertainment, food, and huge open industrial-waterfront space for Mia to run. Part of the Summer at the Terminal series.',timing:'Sun Aug 9 | 2–6pm',location:'Brooklyn Army Terminal, Sunset Park',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynarmyterminal.com/events',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Screenshot-2026-05-13-at-9.51.32-PM-900x547.png',day:'2026-08-09',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260809_2',title:'Free Family Kayaking at Brooklyn Bridge Park',desc:'Sunday family kayaking at Pier 2 in the protected embayment. Toddlers ride in the kayak with a parent, all gear provided. Note: two weeks advance registration is required through the boathouse.',timing:'Sun Aug 9 | 12:00–2:30pm',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-08-09',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260809_3',title:'Smorgasburg Prospect Park',desc:'Sunday food market at Breeze Hill.',timing:'Sun Aug 9 | 11am–6pm',location:'Breeze Hill, Prospect Park',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-08-09',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20260815_6',title:'Summer Streets — Final Manhattan Date of 2026',desc:"The last of the three big Manhattan Summer Streets Saturdays. Eight miles of car-free street from the Brooklyn Bridge to Inwood, with rest stops at Foley Square, Astor Place, and Park Avenue. Perfect for a scooter or balance bike, and it's over by mid-afternoon.",timing:'Sat Aug 15 | 7am–3pm',location:'Brooklyn Bridge → Inwood, Manhattan',distance:'10 min to the Brooklyn Bridge start',source:'NYC DOT',sourceUrl:'https://nyc.gov/summerstreets',imageUrl:'',day:'2026-08-15',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260815_1',title:'Catch-and-Release Fishing at Brooklyn Bridge Park',desc:'One of only five fishing sessions all season (Jun 21, Jul 19, Aug 15, Sep 12, Oct 4). The Maritime Youth Alliance brings every bit of gear to Pier 5 — Mia can watch the line, see a fish up close, and set it free. Free, but advance registration is required.',timing:'Sat Aug 15 | Morning (check brooklynbridgepark.org for exact time)',location:'Brooklyn Bridge Park, Pier 5',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/event-series/catch-and-release-fishing/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Fishing-8.21.2022-Hakan-Uzumcu-57.JPG.png',day:'2026-08-15',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260815_9',title:'Coney Island Sand Sculpting Contest',desc:'Hundreds of sand sculptors take over the beach for one day to build enormous works out of nothing but sand and water. Amateurs compete across five categories and kids can enter too — but the real draw for a three-year-old is wandering the beach watching castles rise. Free.',timing:'Sat Aug 15 | Daytime — check coneyisland.com',location:'Coney Island Beach & Boardwalk, Brooklyn',distance:'~40 min',source:'Mommy Poppins',sourceUrl:'https://mommypoppins.com/new-york-city-kids/weekend-events/things-to-do-in-new-york-city-this-weekend-kids-families',imageUrl:'',day:'2026-08-15',category:'beach',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260815_7',title:'BRIC Celebrate Brooklyn: Americana Night — Yola & Dom Flemons',desc:'A free Bandshell night with Grammy-nominated Yola, Dom Flemons and the Traveling Wildfires, and Cleo Reed. Big, warm, singalong-friendly roots music — the kind of set where a three-year-old dancing on a blanket fits right in.',timing:'Sat Aug 15 | Evening (check bricartsmedia.org for time)',location:'Prospect Park Lena Horne Bandshell, Brooklyn',distance:'20 min',source:'BRIC Celebrate Brooklyn',sourceUrl:'https://bricartsmedia.org/celebrate-brooklyn/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2025/07/celebrate-brooklyn-joe-buglewicz-1274__x_large-800x600.jpg',day:'2026-08-15',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260815_8',title:'Hancock Street Block Party — Bed-Stuy',desc:'An annual Bed-Stuy tradition with multiple DJs, kids activities, and neighbors filling a closed-off block. Small-scale, welcoming, and exactly the kind of street party where toddlers have the run of the place.',timing:'Sat Aug 15 | Afternoon',location:'Hancock St between Marcy & Tompkins, Bed-Stuy',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/IMG_2992-scaled.jpeg',day:'2026-08-15',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260816_6',title:'One Crown Heights Festival at Brower Park',desc:'A free all-ages neighborhood festival with roller skating and free skating lessons, live performances, artmaking, games, a basketball tournament — plus free admission to the Brooklyn Children’s Museum next door. One of the best-value family Sundays of the summer.',timing:'Sun Aug 16 | 12–5pm',location:'Brower Park (Park Pl & Brooklyn Ave), Crown Heights',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/762542980_10174761339915641_4624175957926570377_n.jpg',day:'2026-08-16',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260816_8',title:'International Puppet Fringe Festival — Final Day',desc:'The festival wraps today on the Lower East Side with five family shows in the lineup — Thumbelina, Word Play, Viva Pinocchio, Judy Punches Back, and The Selfish Giant — plus exhibitions and drop-in workshops. Puppetry is about as reliable a bet as there is for a three-year-old attention span.',timing:'Sun Aug 16 | Final day — check schedule for showtimes',location:'Clemente Soto Vélez Center, Lower East Side, Manhattan',distance:'~30 min',source:'Mommy Poppins',sourceUrl:'https://mommypoppins.com/new-york-city-kids/weekend-events/things-to-do-in-new-york-city-this-weekend-kids-families',imageUrl:'',day:'2026-08-16',category:'arts',tags:['indoor','toddler-friendly']},
  {id:'w20260816_7',title:'Sunflower Picking at Sunflower Valley Farm',desc:'Acres of sunflowers at peak bloom in Orange County — towering rows that a three-year-old can walk through like a maze. Admission includes three cut flowers ($10 adults, $5 ages 5–12). Open Fri–Sun 10am–5pm.',timing:'Sun Aug 16 | 10am–5pm',location:'Sunflower Valley Farm, New Hampton, NY',distance:'~80 min',source:'Mommy Poppins',sourceUrl:'https://www.sunflowervalleyfarm.com/',imageUrl:'',day:'2026-08-16',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260816_2',title:'Free Family Kayaking at Brooklyn Bridge Park',desc:'Sunday family kayaking at Pier 2 — all gear provided, toddlers ride in the kayak with a parent. Advance registration required through the boathouse.',timing:'Sun Aug 16 | 12:00–2:30pm',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-08-16',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260816_1',title:'Summer of Moomin at New York Botanical Garden',desc:'An immersive Moominvalley experience — a clue-based quest through the garden, hands-on nature crafts, and character photo moments. Runs Tuesdays–Sundays through September 13. Made for a toddler who likes whimsy.',timing:'Sun Aug 16 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-08-16',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260822_6',title:'NY Liberty vs Indiana Fever',desc:'The biggest ticket on the Liberty home schedule — Indiana always packs Barclays. Heads up: 7pm tipoff is late for Mia, so this may be a first-half-only night or a Jeff-and-Tania date. Ten minutes from home either way.',timing:'Sat Aug 22 | 7:00pm ET',location:'Barclays Center, 620 Atlantic Ave, Downtown Brooklyn',distance:'10 min',source:'NY Liberty',sourceUrl:'https://liberty.wnba.com/schedule',imageUrl:'',day:'2026-08-22',category:'sports',tags:['indoor','toddler-friendly']},
  {id:'w20260822_2',title:'Sunflower Festival at Barton Orchards',desc:'Hayride up to a five-acre rolling field with roughly 100,000 sunflowers in every size and color — cut your own, take pictures, and wander. Live music and craft vendors alongside. The festival runs Aug 22–24 and Aug 29–Sep 1 only.',timing:'Sat Aug 22 | Festival weekend (check bartonorchards.com)',location:'Barton Orchards, Poughquag, NY (Dutchess County)',distance:'~85 min',source:'Hudson Valley Magazine',sourceUrl:'https://hvmag.com/things-to-do/sunflower-fields-hudson-valley/',imageUrl:'',day:'2026-08-22',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260822_1',title:'Summer of Moomin at NYBG',desc:'The Moominvalley quest through the gardens, craft stations, and character moments. Running Tue–Sun through Sep 13.',timing:'Sat Aug 22 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-08-22',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260822_3',title:'Rockaway Beach — Final Peak Beach Weekends',desc:'Late August beach days are the good ones — warm water, thinner crowds, full lifeguard coverage. The 30th Street splash pad is still running.',timing:'Sat Aug 22 | All day',location:'Rockaway Beach, Queens (30th St)',distance:'~45 min',source:'Mommy Poppins',sourceUrl:'https://mommypoppins.com/best-things-to-do-rockaway-beach-kids-itinerary',imageUrl:'',day:'2026-08-22',category:'beach',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260822_5',title:'Vanderbilt Avenue Open Street',desc:'Vanderbilt goes car-free every Saturday through the end of September — live music, games, crafts, workshops and food spilling out of the avenue’s own restaurants. Now in its seventh season, and one of the easiest things on the list to drop into for an hour on the way somewhere else.',timing:'Sat Aug 22 | 12–10pm',location:'Vanderbilt Ave between Atlantic Ave & Park Pl, Prospect Heights',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-08-22',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260823_1',title:"Arthur Ashe Kids' Day — Free US Open Kickoff",desc:"The largest grassroots tennis event in the world, and it opens US Open Fan Week. Player appearances, interactive tennis, games, and a stadium show across the grounds. Admission is free but you need a free Fan Access Pass — grab one online before you go.",timing:'Sun Aug 23 | Grounds 9:30am–6pm',location:'USTA Billie Jean King National Tennis Center, Flushing, Queens',distance:'~45 min',source:'US Open / USTA',sourceUrl:'https://www.usopen.org/en_US/fan-week/arthur-ashe-kids-day.html',imageUrl:'',day:'2026-08-23',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260823_6',title:'SummerStage: Angélique Kidjo in Central Park',desc:"A free SummerStage set from one of the great voices in world music — huge, joyful, percussion-driven, and easy to enjoy from the back of the lawn with a toddler. Part of SummerStage's 40th anniversary season. Free but RSVP in advance.",timing:'Sun Aug 23 | Check cityparksfoundation.org for time',location:'Central Park SummerStage (Rumsey Playfield), Manhattan',distance:'~45 min',source:'City Parks Foundation',sourceUrl:'https://cityparksfoundation.org/summerstage/',imageUrl:'',day:'2026-08-23',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260823_3',title:'Free Family Kayaking at Brooklyn Bridge Park',desc:'Late-summer Sunday kayaking at Pier 2 with the Manhattan skyline as backdrop. Advance registration required.',timing:'Sun Aug 23 | 12:00–2:30pm',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-08-23',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260823_2',title:'Summer of Moomin at NYBG',desc:'Three weekends left before it closes Sep 13. Outdoor scavenger hunt through the gardens, craft stations, character photo moments.',timing:'Sun Aug 23 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-08-23',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260823_5',title:'Smorgasburg Prospect Park',desc:'Sunday food market at Breeze Hill with the full late-August vendor lineup.',timing:'Sun Aug 23 | 11am–6pm',location:'Breeze Hill, Prospect Park',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-08-23',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20260829_1',title:'NY Liberty vs Chicago Sky — West Indian Night',desc:'A 1pm Saturday tipoff at Barclays, which is about as toddler-friendly as pro sports gets. West Indian Night adds music and cultural celebration on top of a good matchup, ten minutes from your door.',timing:'Sat Aug 29 | 1:00pm ET',location:'Barclays Center, 620 Atlantic Ave, Downtown Brooklyn',distance:'10 min',source:'NY Liberty',sourceUrl:'https://liberty.wnba.com/schedule',imageUrl:'',day:'2026-08-29',category:'sports',tags:['indoor','toddler-friendly']},
  {id:'w20260829_2',title:'BRIC Celebrate Brooklyn: Dominican Night — Last Free Night of the Season',desc:'Borough President Antonio Reynoso presents Dominican Night, and this is the final free show of the 2026 Celebrate Brooklyn season (the Sep 19 closer is a ticketed benefit). Merengue and bachata, a huge crowd, and plenty of room to dance with Mia at the back of the lawn.',timing:'Sat Aug 29 | 5pm',location:'Prospect Park Lena Horne Bandshell, Brooklyn',distance:'20 min',source:'BRIC Celebrate Brooklyn',sourceUrl:'https://bricartsmedia.org/celebrate-brooklyn/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2025/07/celebrate-brooklyn-joe-buglewicz-1274__x_large-800x600.jpg',day:'2026-08-29',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260829_6',title:'Back-to-School Bash — Summer Saturdays at Atlantic Terminal',desc:'The last Summer Saturday of the season on the Atlantic Terminal plaza, themed as a Back-to-School Bash: free water play, crafts, games, block building, and giveaways. Bring a bathing suit and towel. Ten-minute walk, 11am–1pm, no commitment. Free RSVP via Brooklyn Bridge Parents.',timing:'Sat Aug 29 | 11am–1pm',location:'Atlantic Terminal Mall Plaza, Fort Greene',distance:'10 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Screenshot-2026-08-20-at-7.18.55-PM.png',day:'2026-08-29',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260829_7',title:'US Open Fan Week — Last Free Day',desc:'The final day of Fan Week, before the main draw starts Sunday Aug 30. Qualifying matches, practice courts with top players a few feet away, and the whole grounds open — all free with a Fan Access Pass. Far more relaxed than tournament week with a toddler.',timing:'Sat Aug 29 | Daytime (free Fan Access Pass required)',location:'USTA Billie Jean King National Tennis Center, Flushing, Queens',distance:'~45 min',source:'US Open',sourceUrl:'https://www.usopen.org/en_US/news/articles/2026-08-04/what_to_know_about_us_open_fan_week_2026.html',imageUrl:'',day:'2026-08-29',category:'sports',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260829_5',title:'Smorgasburg Williamsburg',desc:'Late-August Saturday market before the season shifts to fall.',timing:'Sat Aug 29 | 11am–6pm',location:'Marsha P. Johnson State Park, Williamsburg',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-08-29',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20260830_6',title:'End of Summer Event at Brooklyn Army Terminal',desc:'The closing party of the Summer at the Terminal series — live entertainment, food, and family activities along the Sunset Park waterfront. Free, wide open, and a nice low-key way to close out the summer.',timing:'Sun Aug 30 | 2–6pm',location:'Brooklyn Army Terminal, Sunset Park',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynarmyterminal.com/events',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Screenshot-2026-05-13-at-9.51.32-PM-900x547.png',day:'2026-08-30',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260830_8',title:'Sunflower Festival at Barton Orchards — Closing Weekend',desc:'The second and final run of Barton’s sunflower festival (Aug 29–Sep 1). Hayride out to five rolling acres of roughly 100,000 sunflowers, cut your own, live music and craft vendors by the field. A genuinely great toddler outing if the weather holds.',timing:'Sun Aug 30 | Festival hours (check bartonorchards.com)',location:'Barton Orchards, Poughquag, NY (Dutchess County)',distance:'~85 min',source:'Hudson Valley Magazine',sourceUrl:'https://hvmag.com/things-to-do/sunflower-fields-hudson-valley/',imageUrl:'',day:'2026-08-30',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260830_2',title:'Free Family Kayaking at Brooklyn Bridge Park',desc:'Sunday family kayaking at Pier 2. All gear provided, toddlers ride with a parent. Advance registration required.',timing:'Sun Aug 30 | 12:00–2:30pm',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-08-30',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260830_3',title:'Summer of Moomin at NYBG',desc:'Final two weekends of the Moomin experience before it closes Sep 13 — the Moominvalley trail, craft stations, and character moments.',timing:'Sun Aug 30 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-08-30',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260830_4',title:'Smorgasburg Prospect Park',desc:'Sunday food market at Breeze Hill — one of the last big summer market days.',timing:'Sun Aug 30 | 11am–6pm',location:'Breeze Hill, Prospect Park',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-08-30',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20260905_6',title:'Richmond County Fair — 46th Annual',desc:"Staten Island's big Labor Day weekend fair at Historic Richmond Town, running Sep 5–7. Pony rides, a butterfly vivarium, face painting, carnival rides, roaming entertainers, plus blacksmithing and open-hearth cooking demos in the living-history village. $7–$15.",timing:'Sat Sep 5 | 12–8pm',location:'Historic Richmond Town, Staten Island',distance:'~60 min',source:'New York Family',sourceUrl:'https://www.historicrichmondtown.org/rcf',imageUrl:'',day:'2026-09-05',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260905_8',title:'West Indian Carnival Junior Parade — Crown Heights',desc:'The children’s edition of New York’s largest cultural celebration, and the one actually built for kids. Assembles at St. John’s Place and Kingston Ave at 9am and parades to the Brooklyn Museum, where Youth Fest runs the same day with a youth costume parade, music and dance. Free to watch; museum admission is free for under-12s.',timing:'Sat Sep 5 | Assembles 9am',location:'St. John’s Pl at Kingston Ave → Brooklyn Museum, Crown Heights',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-09-05',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260905_7',title:'Apple Picking Opening Day — Masker Orchards',desc:"Masker's opens its 2026 apple season today. You drive right up to the tree with your picnic gear, which removes basically every logistical problem of apple picking with a three-year-old. 200 acres in Warwick, over 100 years of doing this.",timing:'Sat Sep 5 | Season opens today (check maskers.com)',location:'Masker Orchards, Warwick, NY (Hudson Valley)',distance:'~75 min',source:'Hudson Valley Magazine',sourceUrl:'https://www.maskers.com/',imageUrl:'',day:'2026-09-05',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260905_2',title:'US Open — First Saturday of the Main Draw',desc:'The main draw opened Sunday Aug 30, so this is third-round Saturday. A grounds pass lets you roam the outer courts and watch several matches up close — far better with a toddler than a stadium ticket. Go early, plan for a nap-time exit.',timing:'Sat Sep 5 | Day session (grounds pass)',location:'USTA Billie Jean King National Tennis Center, Flushing, Queens',distance:'~45 min',source:'US Open',sourceUrl:'https://www.usopen.org/',imageUrl:'',day:'2026-09-05',category:'sports',tags:['outdoor','toddler-friendly']},
  {id:'w20260905_3',title:'Governors Island — Early Fall',desc:'The island is at its best in early September — thinner crowds, beautiful light on the water. The Yard playground, art installations, food vendors. Free ferry before 11am from Pier 6.',timing:'Sat Sep 5 | Opens 7am',location:'Governors Island — ferry from Pier 6',distance:'20 min',source:'Governors Island',sourceUrl:'https://www.govisland.com/',imageUrl:'',day:'2026-09-05',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260906_6',title:'Richmond County Fair — Day 2',desc:'Second day of the Richmond County Fair. If Saturday looks crowded, Sunday afternoon at Historic Richmond Town is the gentler option — same pony rides, butterfly vivarium, face painting, and 100+ vendors, more room to breathe.',timing:'Sun Sep 6 | 12–8pm',location:'Historic Richmond Town, Staten Island',distance:'~60 min',source:'New York Family',sourceUrl:'https://www.historicrichmondtown.org/rcf',imageUrl:'',day:'2026-09-06',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260906_8',title:'Hudson Valley Flower Festival at Kelder’s Farm — Final Weekend',desc:'A ten-acre field of sunflowers in every shade of yellow, gold and red, and the festival ends Sep 7. Admission includes Kelder’s Farmyard with 35+ attractions — a jumping pillow, petting farm and mini-golf — which is what makes this one work for a three-year-old rather than just for the photos.',timing:'Sun Sep 6 | Festival runs through Sep 7 (check keldersfarm.com)',location:'Kelder’s Farm, Kerhonkson, NY (Ulster County)',distance:'~110 min',source:'Hudson Valley Country',sourceUrl:'https://keldersfarm.com/pages/sunflower-festival',imageUrl:'',day:'2026-09-06',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260906_1',title:'Brooklyn Botanic Garden — Fall Discovery Visit',desc:'A September Sunday at the BBG as the garden turns toward fall. The Discovery Garden is open for digging and exploring. Note: the Fall First Discoveries toddler drop-in starts Sep 9, running Wed & Fri through Nov 6.',timing:'Sun Sep 6 | Opens 10am',location:'Brooklyn Botanic Garden',distance:'20 min',source:'Brooklyn Botanic Garden',sourceUrl:'https://www.bbg.org/learn/kids_and_families',imageUrl:'',day:'2026-09-06',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260906_2',title:'Summer of Moomin at NYBG — Second-to-Last Weekend',desc:"If you haven't gone, this is the second-to-last chance. Moominvalley trail, craft stations, and character moments, running Tue–Sun through Sep 13.",timing:'Sun Sep 6 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-09-06',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260906_7',title:'Free Family Kayaking at Brooklyn Bridge Park',desc:'Sunday family kayaking continues into September at Pier 2 — cooler air, calmer water, same free gear and life vests. Advance registration required through the boathouse.',timing:'Sun Sep 6 | 12:00–2:30pm',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-09-06',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260912_6',title:'Long Island Fair at Old Bethpage Village',desc:'A proper old-fashioned county fair — animals, glass blowing, live music, contests, demonstrations, face painting, and vendors, set in a restored 19th-century village. Free for under-5s, $15 ages 5–12. Runs Sep 12–14, 10am–5pm.',timing:'Sat Sep 12 | 10am–5pm',location:'Old Bethpage Village Restoration, Old Bethpage, NY (Long Island)',distance:'~60 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-12',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260912_1',title:'Catch-and-Release Fishing at Brooklyn Bridge Park',desc:'The second-to-last fishing session of the season at Pier 5 — Maritime Youth Alliance brings all the gear. Free, and one of the most reliably good toddler activities in the park. Advance registration required.',timing:'Sat Sep 12 | Morning (check brooklynbridgepark.org)',location:'Brooklyn Bridge Park, Pier 5',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/event-series/catch-and-release-fishing/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Fishing-8.21.2022-Hakan-Uzumcu-57.JPG.png',day:'2026-09-12',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260912_8',title:'Brooklyn Americana Music Festival — Kids’ Show at the DUMBO Archway',desc:'The festival’s 12th edition, and Saturday is the day built for children: the outdoor Archway stage opens at 2pm with an all-new kids’ show from Neha Jiwrajka, then runs bands through to 9pm. Fifteen minutes from home under the Manhattan Bridge. The Archway stage price hadn’t been posted at scan time — check before you go.',timing:'Sat Sep 12 | From 2pm (kids’ show opens)',location:'DUMBO Archway, Water St at Anchorage Pl',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-09-12',category:'music',tags:['outdoor','toddler-friendly']},
  {id:'w20260912_4',title:'The Amazing Maize Maze at Queens County Farm',desc:"New York City's only corn maze, now confirmed for 2026: Saturdays and Sundays 11am–4pm from Sep 7 through Nov 1. It starts with a Stalk Talk, then you hunt clues through three acres of towering corn to Victory Bridge. $17 adults, $10 ages 3–11, free for 2 and under.",timing:'Sat Sep 12 | 11am–4pm',location:'Queens County Farm Museum, Floral Park, Queens',distance:'~40 min',source:'New York Family',sourceUrl:'https://www.queensfarm.org/event/amazing-maize-maze/',imageUrl:'',day:'2026-09-12',category:'farm',tags:['outdoor','toddler-friendly']},
  {id:'w20260912_7',title:'Apple Picking at Fishkill Farms',desc:'September is prime apple season at Fishkill — low branches Mia can reach, a cider donut operation that justifies the drive on its own, and an orchard laid out for wandering. Reserve pick-your-own in advance.',timing:'Sat Sep 12 | Opens 9am (reserve at fishkillfarms.com)',location:'Fishkill Farms, Hopewell Junction, NY',distance:'~90 min',source:'Fishkill Farms',sourceUrl:'https://fishkillfarms.com/',imageUrl:'',day:'2026-09-12',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260913_1',title:'Brooklyn Back-to-School Party — Montague Street',desc:'The Brooklyn Bridge Parents annual Back-to-School Party returns to car-free Montague Street: free kids activities, games, crafts, face painting, and community vendors. It also kicks off seven straight Sundays of Montague Open Streets. Fifteen minutes from home and free — RSVP on Eventbrite.',timing:'Sun Sep 13 | 12–4pm',location:'Montague Street, Brooklyn Heights',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/2025_0913_Montague-Back-to-School-Party_EDITS-15-scaled.jpg',day:'2026-09-13',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260913_7',title:'Play in the Square at Domino Park',desc:'Bilingual sing-alongs in Spanish and English with Lina Sings at noon, then Brooklyn-inspired crafts with Artful Souls & Wellness at 2pm, right on Domino Square by the water. Free, drop-in, and pitched squarely at Mia’s age.',timing:'Sun Sep 13 | 12–1pm and 2–3pm',location:'Domino Square, 12 S 3rd St, Williamsburg',distance:'20 min',source:'New York Family',sourceUrl:'https://www.dominopark.com/events',imageUrl:'',day:'2026-09-13',category:'music',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260913_6',title:'Long Island Fair — Day 2',desc:'Second day of the Long Island Fair at Old Bethpage Village Restoration. Animals, demonstrations, live music, and fair food across a restored 1800s village. Free for under-5s.',timing:'Sun Sep 13 | 10am–5pm',location:'Old Bethpage Village Restoration, Old Bethpage, NY',distance:'~60 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-13',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260913_3',title:'Summer of Moomin at NYBG — Final Day',desc:"The last day of the Moomin experience at NYBG. If you haven't gone, this is genuinely it — the Moominvalley trail, crafts, and character moments all close today.",timing:'Sun Sep 13 | 10am–6pm',location:'New York Botanical Garden, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.nybg.org/',imageUrl:'',day:'2026-09-13',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260913_5',title:'Governors Island — September Sunday',desc:'A September Sunday on the island. The Yard playground, art installations, and harbor views in beautiful fall light.',timing:'Sun Sep 13 | Opens 7am',location:'Governors Island — ferry from Pier 6',distance:'20 min',source:'Governors Island',sourceUrl:'https://www.govisland.com/',imageUrl:'',day:'2026-09-13',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260919_1',title:'FAMChella on Car-Free 5th Avenue — Bay Ridge',desc:'The second annual FAMChella turns thirteen car-free blocks of 5th Avenue into a Coachella-inspired block party built entirely for families: a family dance party, bouncy house, arts and crafts, LEGO play, water fun and games, all free. Bring a bathing suit and towel for the water play. Free RSVP through Brooklyn Bridge Parents.',timing:'Sat Sep 19 | 3–6pm',location:'5th Ave between 68th & 81st St, Bay Ridge',distance:'~35 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-09-19',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260919_2',title:'The Amazing Maize Maze at Queens County Farm',desc:"NYC's only corn maze, on a working farm with animals to visit alongside it. Begins with a Stalk Talk, then clue-hunting through three acres of corn to Victory Bridge. Sat & Sun 11am–4pm through Nov 1. $17 adults, $10 ages 3–11, free under 2.",timing:'Sat Sep 19 | 11am–4pm',location:'Queens County Farm Museum, Floral Park, Queens',distance:'~40 min',source:'New York Family',sourceUrl:'https://www.queensfarm.org/event/amazing-maize-maze/',imageUrl:'',day:'2026-09-19',category:'farm',tags:['outdoor','toddler-friendly']},
  {id:'w20260919_3',title:'Vanderbilt Avenue Open Street — Final Weeks',desc:'One of the last Saturdays of the seventh Vanderbilt Open Street season. Car-free from Atlantic to Park Place with live music, games, crafts, workshops and restaurant tables spilling into the road. Fifteen minutes away, free, and easy to drop into for an hour.',timing:'Sat Sep 19 | 12–10pm',location:'Vanderbilt Ave between Atlantic Ave & Park Pl, Prospect Heights',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-09-19',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260919_4',title:'Westerleigh Folk Festival — Staten Island',desc:'An all-day free music and arts festival in a leafy Staten Island park, with live bands, handcraft vendors and a dedicated run of children’s activities. Low-key, grassy and unhurried — the kind of festival where a toddler can wander without anyone minding.',timing:'Sat Sep 19 | 11am–7pm',location:'Westerleigh Park, Neal Dow & Maine Ave, Staten Island',distance:'~60 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-19',category:'music',tags:['free','outdoor','daytrip','toddler-friendly']},
  {id:'w20260919_5',title:'Lewis Latimer’s 178th Birthday Celebration',desc:'The Lewis Latimer House throws a free birthday party for the Black inventor who helped light the modern world — interactive performances, games, and hands-on STEAM activities pitched at the whole family. Small, friendly, and a nice change of pace from a big festival.',timing:'Sat Sep 19 | 1–4pm',location:'Lewis Latimer House Museum, 34-41 137th St, Flushing, Queens',distance:'~50 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-19',category:'arts',tags:['free','indoor','toddler-friendly']},
  {id:'w20260920_1',title:'Reading Party at Brooklyn Bridge Park Pier 6',desc:'One of only three reading parties Brooklyn Bridge Park runs all year (June 7, August 2, and today). Bring Mia’s favourite books down to Pier 6 and read on the grass by the water. Free, ten minutes from home, and about as low-effort as a good Sunday morning gets.',timing:'Sun Sep 20 | Check brooklynbridgepark.org for time',location:'Brooklyn Bridge Park, Pier 6',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/events/',imageUrl:'',day:'2026-09-20',category:'arts',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260920_2',title:'Spellbound Theater at Domino Park',desc:'Spellbound Theater makes theater specifically for the very young, and they bring an interactive bilingual English and Spanish performance built for ages 0–5 to Domino Square. Genuinely designed for a three-year-old rather than merely tolerating one. Free.',timing:'Sun Sep 20 | 4–5pm',location:'Domino Square, Williamsburg Waterfront',distance:'20 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://www.dominopark.com/events',imageUrl:'',day:'2026-09-20',category:'arts',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260920_3',title:'Little Spoon Presents: The Music of Blink-182 for Kids',desc:'A free family rock show at Brooklyn Bowl for ages 10 and under — a live band playing Blink-182 and friends at toddler-appropriate volume and a toddler-appropriate hour. Twenty minutes away and genuinely fun for the grown-ups too.',timing:'Sun Sep 20 | 12:30pm',location:'Brooklyn Bowl, 61 Wythe Ave, Williamsburg',distance:'20 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-20',category:'music',tags:['free','indoor','toddler-friendly']},
  {id:'w20260920_4',title:'Montague Street Open Streets — FAD Market',desc:'Week two of seven car-free Sundays on Montague Street, this one given over to the FAD Market and 50+ independent makers. Fifteen minutes from home, free, stroller-easy, and a good excuse to let Mia run down the middle of a street that normally has cars on it.',timing:'Sun Sep 20 | 12–6pm',location:'Montague St, Clinton to Hicks, Brooklyn Heights',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-09-20',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260920_5',title:'Kids on the Move: Equilibrium for the Equinox at Wave Hill',desc:'A guided hour of breath, movement and garden exploration for ages 3–8 on the Wave Hill grounds, marking the fall equinox — hunting for the first signs of autumn and the last reminders of summer along mixed-material paths. $4–$10, and Mia is right in the target age.',timing:'Sun Sep 20 | 1:30–2:30pm',location:'Wave Hill, 675 W 252nd St, The Bronx',distance:'~55 min',source:'New York Family',sourceUrl:'https://www.newyorkfamily.com/20-best-september-events-across-nyc/',imageUrl:'',day:'2026-09-20',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20260926_1',title:'Brooklyn Book Festival Children’s Day — Borough Hall',desc:'A full free day of picture-book readings, puppet shows, illustrator draw-offs, art projects and workshops across Brooklyn Borough Hall and its plaza. The Picture Book Stage runs author readings all day long, and it is a ten-minute walk from your front door. The single best-fit event of the whole six-week window for Mia.',timing:'Sat Sep 26 | 10am–4pm',location:'Brooklyn Borough Hall & Plaza, 209 Joralemon St, Downtown Brooklyn',distance:'5 min',source:'Brooklyn Book Festival',sourceUrl:'https://brooklynbookfestival.org/event_type/childrens-day/',imageUrl:'https://brooklynbookfestival.org/wp-content/uploads/2020/07/BkBf-Childrens-Day-2018-_-212.jpg',day:'2026-09-26',category:'arts',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260926_2',title:'Hudson Valley Garlic Festival — Saugerties',desc:'A thirty-plus-year Hudson Valley institution with 200+ vendors at the Cantine Memorial Complex. For Mia there is face painting, games, hands-on kids activities, and an Arm-of-the-Sea Theater puppet show at 11:30am and 2:15pm. Children 12 and under are free, and yes, there is garlic ice cream.',timing:'Sat Sep 26 | 10am–6pm (puppet show 11:30am & 2:15pm)',location:'Cantine Memorial Complex, Saugerties, NY (Ulster County)',distance:'~110 min',source:'Hudson Valley Garlic Festival',sourceUrl:'https://www.hvgf.org/',imageUrl:'',day:'2026-09-26',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260926_3',title:'Apple & Pumpkin Picking at Hurds Family Farm',desc:'Late September is the sweet spot for apples in the Hudson Valley, and Hurds is built for small children rather than just tolerating them: a cow train, bounce pillow, hayride, duck racing, farm animals, obstacle course and nature trails alongside the picking. Seventh-generation family farm on 125 acres.',timing:'Sat Sep 26 | Opens 10am (check hurdsfamilyfarm.com)',location:'Hurds Family Farm, Modena, NY (Ulster County)',distance:'~100 min',source:'Hudson Valley Magazine',sourceUrl:'https://www.hurdsfamilyfarm.com/',imageUrl:'',day:'2026-09-26',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260926_4',title:'Free Kayaking at Brooklyn Bridge Park — Season Winding Down',desc:'Once September arrives the free public kayaking at Pier 2 switches to Saturdays only, and the season closes out this month. Cool air, calm water, all gear and life vests provided, toddlers ride in the kayak with a parent. Check the boathouse for the final dates and register in advance.',timing:'Sat Sep 26 | Check bbpboathouse.org for session times',location:'Brooklyn Bridge Park, Pier 2',distance:'10 min',source:'Brooklyn Bridge Park Boathouse',sourceUrl:'https://www.bbpboathouse.org/',imageUrl:'',day:'2026-09-26',category:'water',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260926_5',title:'Smorgasburg Williamsburg — Fall Edition',desc:'The Saturday market runs through October, and late September is arguably its best stretch: no heat, no crowds crushing the aisles, and the waterfront park at Marsha P. Johnson State Park with room for Mia to run between bites.',timing:'Sat Sep 26 | 11am–6pm',location:'Marsha P. Johnson State Park, Williamsburg',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-09-26',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20260927_1',title:'The Atlantic Antic — Brooklyn’s Biggest Street Festival',desc:'The oldest and largest street festival in Brooklyn takes over Atlantic Avenue from Fourth Avenue all the way to the waterfront — essentially past your door. There is a dedicated kids’ block with pony rides, bounce houses, face painting and circus performers, plus food from every restaurant on the avenue. Free, rain or shine. Confirmed for its 51st year on Sunday, September 27.',timing:'Sun Sep 27 | 12–6pm, rain or shine',location:'Atlantic Ave, 4th Ave to the waterfront, Brooklyn',distance:'5 min',source:'Atlantic Avenue LDC',sourceUrl:'https://www.atlanticave.org/atlanticantic',imageUrl:'https://static.wixstatic.com/media/50f263_cc59606f40bb490a96a6193e921edfd2~mv2.jpg/v1/fill/w_321,h_232,q_90,enc_avif,quality_auto/50f263_cc59606f40bb490a96a6193e921edfd2~mv2.jpg',day:'2026-09-27',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260927_2',title:'Flatbush Frolic on Cortelyou Road',desc:'One of the largest street fairs in the city and a genuinely neighborhood-feeling one — hundreds of vendors, food, games and pony rides along Cortelyou Road between Coney Island and Ocean Avenues. Free, and a gentler alternative if the Antic looks too dense with a stroller.',timing:'Sun Sep 27 | 10am–6pm',location:'Cortelyou Rd, Coney Island Ave to Ocean Ave, Ditmas Park',distance:'25 min',source:'Flatbush Development Corporation',sourceUrl:'https://www.fdconline.org/news-events/flatbush-frolic-september-27/',imageUrl:'',day:'2026-09-27',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260927_3',title:'Brooklyn Book Festival — Main Festival Day',desc:'The main festival day fills Borough Hall Plaza and the surrounding streets with a huge free literary marketplace. Less toddler-targeted than Saturday’s Children’s Day, but the outdoor marketplace is stroller-easy and there is still children’s programming in the mix. Five minutes from home and free.',timing:'Sun Sep 27 | Daytime — check the schedule',location:'Brooklyn Borough Hall Plaza & Columbus Park, Downtown Brooklyn',distance:'5 min',source:'Brooklyn Book Festival',sourceUrl:'https://brooklynbookfestival.org/',imageUrl:'https://brooklynbookfestival.org/wp-content/uploads/2023/03/bkbf_top_banner-1.png',day:'2026-09-27',category:'arts',tags:['free','outdoor','toddler-friendly']},
  {id:'w20260927_4',title:'Hudson Valley Garlic Festival — Day 2',desc:'Sunday at Saugerties runs a shorter day and tends to be the calmer of the two. Same Arm-of-the-Sea puppet show at 11:30am and 2:15pm, same face painting and kids activities tent, same 200+ vendors. Children 12 and under free.',timing:'Sun Sep 27 | 10am–5pm (puppet show 11:30am & 2:15pm)',location:'Cantine Memorial Complex, Saugerties, NY (Ulster County)',distance:'~110 min',source:'Hudson Valley Garlic Festival',sourceUrl:'https://www.hvgf.org/',imageUrl:'',day:'2026-09-27',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20260927_5',title:'Amazing Maize Maze & Pumpkin Patch at Queens County Farm',desc:'Late September is when the pumpkin patch really comes into its own alongside the corn maze — plus a farm stand with 200+ farm-grown offerings and the resident pigs, goats, alpacas, sheep and chickens, which for a three-year-old is usually the actual main event. $17 adults, $10 ages 3–11, free under 2.',timing:'Sun Sep 27 | 11am–4pm (last entry 4pm)',location:'Queens County Farm Museum, 73-50 Little Neck Pkwy, Floral Park, Queens',distance:'~40 min',source:'Queens County Farm Museum',sourceUrl:'https://www.queensfarm.org/event/amazing-maize-maze/',imageUrl:'',day:'2026-09-27',category:'farm',tags:['outdoor','toddler-friendly']},
  {id:'w20261003_1',title:'Fort Totten Fall Festival — Free Puppet Show & Games',desc:'NYC Parks throws a free fall festival on the old fort grounds looking out over Little Neck Bay: family games and activities, roaming performers, and a puppet show. Three hours, no tickets, no registration — the kind of low-commitment outing that works if the morning goes sideways.',timing:'Sat Oct 3 | 1–4pm',location:'Fort Totten Park, Bayside, Queens',distance:'~50 min',source:'NYC Parks',sourceUrl:'https://www.nycgovparks.org/events/2026/10/03/fort-totten-fall-festival',imageUrl:'',day:'2026-10-03',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261003_2',title:'Fall Harvest Festival at Fishkill Farms',desc:'Fishkill runs Harvest Festival every Saturday and Sunday from early September through October, and this is the peak-apple stretch. Wagon rides through the orchard are free on weekends, there is a corn maze, live music in the courtyard, and apple cider donuts straight out of the donut window. Reserve pick-your-own in advance.',timing:'Sat Oct 3 | Festival weekend — reserve at fishkillfarms.com',location:'Fishkill Farms, Hopewell Junction, NY (Dutchess County)',distance:'~90 min',source:'Fishkill Farms',sourceUrl:'https://www.fishkillfarms.com/visit/pick-your-own/',imageUrl:'',day:'2026-10-03',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261003_3',title:'WNBA Playoffs at Barclays Center',desc:'The 2026 WNBA playoffs opened September 27 and the Liberty are in for a sixth straight year. If the bracket falls their way there is postseason basketball ten minutes from your door this weekend — genuinely the loudest, best atmosphere Barclays gets all year. Check liberty.wnba.com for the confirmed date and tipoff before planning around it.',timing:'Sat Oct 3 | Playoff schedule TBD — check liberty.wnba.com',location:'Barclays Center, 620 Atlantic Ave, Downtown Brooklyn',distance:'10 min',source:'NY Liberty',sourceUrl:'https://liberty.wnba.com/schedule',imageUrl:'',day:'2026-10-03',category:'sports',tags:['indoor','toddler-friendly']},
  {id:'w20261003_4',title:'Franklin Avenue Open Street — Crown Heights',desc:'Franklin Avenue goes car-free on select Saturdays, and October 3 is one of only two October dates. Neighborhood-scale, unhurried, and easy to let a three-year-old walk the middle of the road for a while. Free, and pairs well with Brower Park or the Brooklyn Children’s Museum nearby.',timing:'Sat Oct 3 | Daytime (check brooklynbridgeparents.com for hours)',location:'Franklin Ave, Crown Heights, Brooklyn',distance:'25 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'',day:'2026-10-03',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261003_5',title:'Jane’s Carousel & Brooklyn Bridge Park Playgrounds',desc:'A cheap, close, reliably good fall Saturday: a $2 ride on Jane’s Carousel inside its glass pavilion under the bridge, then the Pier 6 water lab and Slide Mountain playgrounds, then pizza in DUMBO. Ten minutes from home and completely weather-flexible — the carousel is indoors if it turns.',timing:'Sat Oct 3 | Carousel 11am–6pm (closed Tuesdays)',location:'Jane’s Carousel, Brooklyn Bridge Park, DUMBO',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/things-to-do/janes-carousel/',imageUrl:'',day:'2026-10-03',category:'special',tags:['outdoor','toddler-friendly']},
  {id:'w20261004_1',title:'Gotham FC vs Angel City FC — Scouts Day',desc:'A noon kickoff at Sports Illustrated Stadium against Angel City, on national TV, with Scouts Day tickets at $28 that include an on-field parade before the match and a Gotham uniform patch. Midday start, short drive, and a stadium small enough that a three-year-old can actually see the game. The best-fit sports pick of the whole window.',timing:'Sun Oct 4 | 12:00pm ET (on ABC)',location:'Sports Illustrated Stadium, Harrison, NJ',distance:'~35 min',source:'Gotham FC',sourceUrl:'https://www.gothamfc.com/schedule',imageUrl:'https://cdn.sanity.io/images/8mpkhoms/production/43c95927037496ad1614694f6f9bb8f34311ac97-1680x1120.jpg?w=1200&fm=jpg&q=80',day:'2026-10-04',category:'sports',tags:['outdoor','toddler-friendly']},
  {id:'w20261004_2',title:'Catch-and-Release Fishing at Pier 5 — Season Finale',desc:'The last of only five fishing sessions Brooklyn Bridge Park runs all year (Jun 21, Jul 19, Aug 15, Sep 12, Oct 4). Maritime Youth Alliance brings every rod, hook and bucket to Pier 5, Mia can see an East River fish up close and set it free, and it costs nothing. Advance registration required — book this one early.',timing:'Sun Oct 4 | Morning (register at brooklynbridgepark.org)',location:'Brooklyn Bridge Park, Pier 5',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/event-series/catch-and-release-fishing/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/Fishing-8.21.2022-Hakan-Uzumcu-57.JPG.png',day:'2026-10-04',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261004_3',title:'Montague Street Open Streets — Week 4',desc:'The fourth of seven consecutive car-free Sundays on Montague Street, running through late October. Free, fifteen minutes away, stroller-easy, and the whole street belongs to pedestrians for the afternoon. A good default if the weather is nice and nothing else is booked.',timing:'Sun Oct 4 | 12–6pm',location:'Montague St, Clinton to Hicks, Brooklyn Heights',distance:'15 min',source:'Brooklyn Bridge Parents',sourceUrl:'https://brooklynbridgeparents.com/outdoor-festivals-and-street-fairs-in-brooklyn-in-2026/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2026/05/2025_0913_Montague-Back-to-School-Party_EDITS-15-scaled.jpg',day:'2026-10-04',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261004_4',title:'Amazing Maize Maze & Pumpkin Patch — Queens County Farm',desc:'Early October is the best week of the year at Queens Farm: corn maze, pumpkin patch, farm stand, and the pigs, goats, alpacas, sheep and chickens that are usually the real draw for a three-year-old. Sat & Sun 11am–4pm through Nov 1. $17 adults, $10 ages 3–11, free under 2.',timing:'Sun Oct 4 | 11am–4pm (last entry 4pm)',location:'Queens County Farm Museum, 73-50 Little Neck Pkwy, Floral Park, Queens',distance:'~40 min',source:'Queens County Farm Museum',sourceUrl:'https://www.queensfarm.org/event/amazing-maize-maze/',imageUrl:'',day:'2026-10-04',category:'farm',tags:['outdoor','toddler-friendly']},
  {id:'w20261004_5',title:'Brooklyn Children’s Museum — Crown Heights',desc:'The first children’s museum in the world, and still one of the best rainy-Sunday bets in the borough: World Brooklyn’s kid-scale storefronts, the sensory-rich Totally Tots area built for under-fives, and live animals in the Collections Gallery. Twenty-five minutes away and entirely indoors if October turns grey.',timing:'Sun Oct 4 | 10am–5pm',location:'Brooklyn Children’s Museum, 145 Brooklyn Ave, Crown Heights',distance:'25 min',source:'Brooklyn Children’s Museum',sourceUrl:'https://www.brooklynkids.org/',imageUrl:'',day:'2026-10-04',category:'museum',tags:['indoor','toddler-friendly']},
  {id:'w20261010_1',title:'Apple Picking & Petting Zoo at Barton Orchards',desc:'A 122-acre Dutchess County farm with 25 apple varieties, and crucially a whole apparatus around the picking: petting zoo, weekend hayrides, a five-acre corn maze, live music, and an apple cider donut sundae at the concession stand. Admission is $3 and free for under-2s. Columbus Day weekend is peak apple.',timing:'Sat Oct 10 | Opens 10am (check bartonorchards.com)',location:'Barton Orchards, Poughquag, NY (Dutchess County)',distance:'~85 min',source:'Time Out New York',sourceUrl:'https://www.timeout.com/newyork/things-to-do/best-apple-picking-farms-and-orchards-near-NYC',imageUrl:'',day:'2026-10-10',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261010_2',title:'New York Aquarium at Coney Island',desc:'October is the right time for the Aquarium — the boardwalk crowds are gone, the walk-through Ocean Wonders shark tunnel is quiet, and the PlayQuarium touch pools are built for exactly Mia’s age. Mostly indoors, forty minutes on the Q, and pairs with an empty off-season boardwalk walk afterwards.',timing:'Sat Oct 10 | 10am–4:30pm (check nyaquarium.com)',location:'New York Aquarium, 602 Surf Ave, Coney Island',distance:'~40 min',source:'New York Aquarium',sourceUrl:'https://nyaquarium.com/',imageUrl:'',day:'2026-10-10',category:'special',tags:['indoor','toddler-friendly']},
  {id:'w20261010_3',title:'Brooklyn Botanic Garden — Peak Fall Foliage',desc:'Mid-October is when the Japanese Hill-and-Pond Garden and the maples along Cherry Esplanade turn, and it is the single prettiest week of the BBG year. The Discovery Garden is open for digging, leaf-hunting and general mess. Twenty minutes away, and a reliable two hours for a three-year-old.',timing:'Sat Oct 10 | Opens 10am',location:'Brooklyn Botanic Garden, 990 Washington Ave',distance:'20 min',source:'Brooklyn Botanic Garden',sourceUrl:'https://www.bbg.org/learn/kids_and_families',imageUrl:'',day:'2026-10-10',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20261010_4',title:'Smorgasburg Williamsburg — Final Weeks Outdoors',desc:'The outdoor Saturday market wraps up in late October, so this is one of the last few. Marsha P. Johnson State Park has room for Mia to run between bites, the crowds have thinned since summer, and the fall vendor lineup is the year’s best. Free entry.',timing:'Sat Oct 10 | 11am–6pm',location:'Marsha P. Johnson State Park, Williamsburg',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-10-10',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20261010_5',title:'Lefferts Historic House — Fall Harvest at Prospect Park',desc:'The Prospect Park Alliance runs free family programming at Lefferts Historic House May through November: lawn games on the grass, harvesting from the kitchen garden, and food cooked over the outdoor hearth. Small, hands-on, free, and twenty minutes away. RSVP through prospectpark.org.',timing:'Sat Oct 10 | Check prospectpark.org for this weekend’s program',location:'Lefferts Historic House, Prospect Park, Brooklyn',distance:'20 min',source:'Prospect Park Alliance',sourceUrl:'https://www.prospectpark.org/events/',imageUrl:'',day:'2026-10-10',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261011_1',title:'DUMBO Family Games on Car-Free Washington Street',desc:'Every Sunday through September and October, the DUMBO BID closes Washington Street and fills it with LEGO, arts and crafts, and a rotating roster of games — explicitly built for ages 1 to 8, which is a narrower and more useful age band than most family events manage. Free, RSVP on Eventbrite, and it is the classic Manhattan Bridge view block.',timing:'Sun Oct 11 | 11am–1pm',location:'Washington St, DUMBO, Brooklyn',distance:'15 min',source:'Brooklyn Bridge Parents / DUMBO BID',sourceUrl:'https://dumbo.nyc/dumbo-family-games/',imageUrl:'https://brooklynbridgeparents.com/wp-content/uploads/2025/10/Photo-Sep-28-2025-11-43-22-AM-scaled.jpg',day:'2026-10-11',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261011_2',title:'Free Family Skate at the Pier 2 Roller Rink',desc:'The Pier 2 rink runs free community skate sessions on Sundays from 10am to noon — admission costs nothing, skate rental is $8. It is covered, so weather is irrelevant, it is ten minutes from home, and a three-year-old wobbling on the concrete with the Manhattan skyline behind her is a good morning. Season runs through November.',timing:'Sun Oct 11 | 10am–12pm (free session)',location:'Pier 2, Brooklyn Bridge Park',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/things-to-do/roller-skating/',imageUrl:'',day:'2026-10-11',category:'sports',tags:['outdoor','toddler-friendly']},
  {id:'w20261011_3',title:'Governors Island — Last Weeks of Brooklyn Ferry Service',desc:'The seasonal ferry from Pier 6 and Red Hook runs weekends only through November 1, so the easy Brooklyn crossing is nearly done for the year. The island in mid-October is quiet, gold, and completely car-free: The Yard adventure playground, the Hills, and long empty paths for a three-year-old to run down.',timing:'Sun Oct 11 | Brooklyn ferry runs weekends through Nov 1',location:'Governors Island — ferry from Pier 6 or Red Hook',distance:'20 min',source:'Governors Island',sourceUrl:'https://www.govisland.com/plan-your-visit/ferry',imageUrl:'',day:'2026-10-11',category:'nature',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261011_4',title:'Columbus Day Weekend Harvest Festival at Fishkill Farms',desc:'Fishkill adds Monday October 13 to its Harvest Festival run for the long weekend, so Sunday is the middle of a three-day stretch. Free weekend wagon rides through the orchard, the corn maze, live music, hard cider for the grown-ups at the Treasury bar, and cider donuts fresh from the window. Peak foliage on the drive up.',timing:'Sun Oct 11 | Festival weekend (plus Mon Oct 13)',location:'Fishkill Farms, Hopewell Junction, NY (Dutchess County)',distance:'~90 min',source:'Fishkill Farms',sourceUrl:'https://www.fishkillfarms.com/visit/pick-your-own/',imageUrl:'',day:'2026-10-11',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261011_5',title:'Smorgasburg Prospect Park — Fall Edition',desc:'The Sunday market at Breeze Hill in its best season: cool air, no queues out to the path, and a lawn to sit on. Twenty minutes away, free to enter, and an easy pairing with a walk through the park while the leaves turn.',timing:'Sun Oct 11 | 11am–6pm',location:'Breeze Hill, Prospect Park (Lincoln Rd entrance)',distance:'20 min',source:'Smorgasburg',sourceUrl:'https://www.smorgasburg.com/',imageUrl:'',day:'2026-10-11',category:'food',tags:['outdoor','toddler-friendly']},
  {id:'w20261017_1',title:'Brooklyn Bridge Park Harvest Festival — Pier 6',desc:'The park’s annual Harvest Festival closes out the season at Pier 6 with live music, arts and crafts, storytelling, lawn games, face-painting and a pumpkin patch. Confirmed on the park’s own calendar for Saturday, October 17, 11am–3pm, and it is free. Ten minutes from home, four hours long, and squarely aimed at Mia’s age.',timing:'Sat Oct 17 | 11am–3pm',location:'Brooklyn Bridge Park, Pier 6',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/event/harvest-festival/',imageUrl:'https://brooklynbridgepark.org/wp-content/uploads/2026/02/Harvest-Festival-2025-Alexa-Hoyer-19-scaled.jpg',day:'2026-10-17',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261017_2',title:'NY State Sheep & Wool Festival — Rhinebeck',desc:'The 2026 festival runs October 15–18 at the Dutchess County Fairgrounds, and for a three-year-old the fibre-arts vendors are beside the point: this is barns full of sheep, alpacas, llamas, angora rabbits and goats you can get close to, plus sheepdog demonstrations and fair food. Admission is $15–$18 and children get in free.',timing:'Sat Oct 17 | Daytime (festival runs Oct 15–18)',location:'Dutchess County Fairgrounds, 6636 Route 9, Rhinebeck, NY',distance:'~100 min',source:'NY State Sheep & Wool Festival',sourceUrl:'https://sheepandwool.com/',imageUrl:'',day:'2026-10-17',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261017_3',title:'Rosie Revere, Ada Twist & Iggy Peck — New Victory Opening Day',desc:'TheaterWorksUSA’s musical of the Questioneers books opens the New Victory season on October 17 and runs through the 25th. Sixty minutes, no intermission, and after the 11am show on opening day the author Andrea Beaty signs books in the lower lobby. Officially recommended for ages 4+ so Mia is a year under, but there is a quiet Cozy Zone with a live feed downstairs if she needs a break. Tickets from $25.',timing:'Sat Oct 17 | 11am show + Andrea Beaty book signing after',location:'New Victory Theater, 209 W 42nd St, Manhattan',distance:'~35 min',source:'New Victory Theater',sourceUrl:'https://www.newvictory.org/events/2627-live-performance-rosie-revere-ada-twist-and-iggy-peck',imageUrl:'https://images.baskercdn.com/newvictory/media/TWUSA_Ada%20Twist,%20Scientist%20%26%20Friends_L-R-Kalilah%20Black-Kyle%20Sherman-Daisy%20Carnelia-Jenna%20Perez_Photo%20By%20Jeremy%20Daniel%20Photography.webp',day:'2026-10-17',category:'arts',tags:['indoor','toddler-friendly']},
  {id:'w20261017_4',title:'Bluey’s House at CAMP NYC — Final Day',desc:'The walk-through recreation of Bluey’s house ends its run on October 17, and it finishes with a meet-and-greet with Bluey and Bingo. If Mia is anywhere near the Bluey phase this is the highest-payoff hour of the weekend, and it is genuinely the last chance. Ticketed and it does sell out, so book the moment you decide.',timing:'Sat Oct 17 | Final day — timed entry, book ahead',location:'CAMP, 110 5th Ave, Flatiron, Manhattan',distance:'~30 min',source:'Time Out New York',sourceUrl:'https://www.timeout.com/newyork/events-calendar/october-events-calendar',imageUrl:'',day:'2026-10-17',category:'special',tags:['indoor','toddler-friendly']},
  {id:'w20261017_5',title:'The Great Jack O’Lantern Blaze — Van Cortlandt Manor',desc:'More than 7,000 hand-carved illuminated pumpkins along a walking trail through an 18th-century estate, running Sep 18–Nov 8 with timed entry from $24. Take the earliest slot — around 6pm in mid-October it is just dark enough to work and still an hour Mia can handle. The Pumpkin Planetarium and pumpkin bridge are the crowd-pleasers.',timing:'Sat Oct 17 | Timed entry from dusk — book the earliest slot',location:'Van Cortlandt Manor, Croton-on-Hudson, NY',distance:'~60 min',source:'Time Out New York',sourceUrl:'https://www.timeout.com/newyork/events-calendar/october-events-calendar',imageUrl:'',day:'2026-10-17',category:'special',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261018_1',title:'NY State Sheep & Wool Festival — Final Day',desc:'Sunday is the last of the four days at Rhinebeck and generally the calmer one. Same sheep, alpacas, llamas and angora rabbits, same sheepdog demos, and vendors discounting rather than packing things home. Children get in free. If Saturday gets away from you, this is the day to make the drive.',timing:'Sun Oct 18 | Daytime (final day of the festival)',location:'Dutchess County Fairgrounds, 6636 Route 9, Rhinebeck, NY',distance:'~100 min',source:'NY State Sheep & Wool Festival',sourceUrl:'https://sheepandwool.com/',imageUrl:'',day:'2026-10-18',category:'farm',tags:['outdoor','daytrip','toddler-friendly']},
  {id:'w20261018_2',title:'Open House New York Weekend — Sunday Drop-Ins',desc:'The 24th OHNY Weekend opens roughly 300 sites across the five boroughs on October 16–18, 10am–6pm, and most are free drop-ins with no ticket needed. Brooklyn typically fields several that suit a small child — the Naval Cemetery Landscape boardwalk, historic house museums, working waterfront barges. The lineup posts in September, so scan it for Brooklyn sites and pick one nearby.',timing:'Sun Oct 18 | 10am–6pm',location:'~300 sites citywide — filter for Brooklyn drop-ins',distance:'Varies',source:'Open House New York',sourceUrl:'https://ohny.org/activity/2026-ohny-weekend',imageUrl:'',day:'2026-10-18',category:'special',tags:['free','outdoor','toddler-friendly']},
  {id:'w20261018_3',title:'New York Transit Museum — Downtown Brooklyn',desc:'A decommissioned 1936 subway station five minutes from your front door, with two platforms of vintage subway cars Mia can climb on and off freely, a bus she can steer, and turnstiles from a century of the system. Entirely indoors, so it does not care what October does with the weather.',timing:'Sun Oct 18 | Check nytransitmuseum.org for hours',location:'New York Transit Museum, Boerum Pl & Schermerhorn St, Downtown Brooklyn',distance:'5 min',source:'New York Transit Museum',sourceUrl:'https://www.nytransitmuseum.org/',imageUrl:'',day:'2026-10-18',category:'museum',tags:['indoor','toddler-friendly']},
  {id:'w20261018_4',title:'Prospect Park Zoo & Carousel — Peak Foliage Sunday',desc:'Mid-October is when the Long Meadow goes gold and the Lullwater canopy peaks. The zoo is deliberately small and toddler-scaled — sea lion feedings, a barn with animals to touch, and nothing so big it exhausts a three-year-old — and the 1912 carousel by the Willink entrance is a few minutes’ walk away.',timing:'Sun Oct 18 | Zoo from 10am | Carousel afternoons',location:'Prospect Park Zoo, 450 Flatbush Ave, Brooklyn',distance:'20 min',source:'Prospect Park Alliance',sourceUrl:'https://www.prospectpark.org/visit-the-park/things-to-do/prospect-park-zoo/',imageUrl:'',day:'2026-10-18',category:'nature',tags:['outdoor','toddler-friendly']},
  {id:'w20261018_5',title:'Free Family Skate at the Pier 2 Roller Rink',desc:'The Sunday 10am–noon community session is free to enter, with skate rental at $8, and the rink is covered so October weather is irrelevant. Ten minutes from home, an hour is plenty at this age, and there is a full playground complex twenty steps away when she is done. Season runs through November.',timing:'Sun Oct 18 | 10am–12pm (free session)',location:'Pier 2, Brooklyn Bridge Park',distance:'10 min',source:'Brooklyn Bridge Park',sourceUrl:'https://brooklynbridgepark.org/things-to-do/roller-skating/',imageUrl:'',day:'2026-10-18',category:'sports',tags:['outdoor','toddler-friendly']},

let votes={};
