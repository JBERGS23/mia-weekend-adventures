<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mia's Weekends</title>
<style>



:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FBFAF7;
  --ink:#17191E;--ink-2:#4A4F58;--ink-3:#7D838E;--ink-4:#A9AEB8;
  --line:#E8E6E0;--line-2:#DEDBD3;
  --accent:#0E6B54;--accent-ink:#0B5644;--accent-soft:#E2F1EA;--accent-soft-2:#CBE6D8;
  --danger:#B42318;--danger-soft:#FBE9E7;
  --amber:#8A5A00;--amber-soft:#FBF1D9;
  --r-sm:8px;--r:12px;--r-lg:16px;
  --shadow-sm:0 1px 2px rgba(23,25,30,.05);
  --shadow:0 1px 2px rgba(23,25,30,.04),0 6px 20px -8px rgba(23,25,30,.14);
  --shadow-lg:0 24px 60px -20px rgba(23,25,30,.28);
  --font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --jeff:#1D4ED8;--jeff-soft:#E4ECFB;--tania:#B8336A;--tania-soft:#FBE4EE;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft-2)}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--ink-3);margin-left:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.spacer{flex:1}
.search{position:relative;width:260px}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.who{display:inline-flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid var(--line)}
.who-label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.who .seg button{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.j{background:var(--jeff)}.av.t{background:var(--tania)}
.av.sm{width:18px;height:18px;font-size:10px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn.sync{gap:8px;font-size:12px;color:var(--ink-2)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);display:inline-block;flex:none}
.sdot.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sdot.err{background:var(--danger)}
.sdot.busy{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.steps{counter-reset:s;display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:600;display:grid;place-items:center;color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* ── Layout ──────────────────────────────────────────────── */
.shell{max-width:1440px;margin:0 auto;padding:24px 28px 80px;display:grid;grid-template-columns:296px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.panel-h h3{font-size:13px;font-weight:600;letter-spacing:-.005em}
.panel-b{padding:12px 16px 16px}

/* Calendar */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.cal-nav button:hover{background:var(--surface-2)}
.cal-nav button:disabled{color:var(--ink-4);background:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--ink-4);text-align:center;padding:4px 0 6px;letter-spacing:.02em}
.cal-d{position:relative;aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.cal-d.wk{color:var(--ink-3)}
.cal-d.has{color:var(--ink);font-weight:600;cursor:pointer;background:var(--surface-2);border:1px solid var(--line)}
.cal-d.has:hover{border-color:var(--line-2);background:#fff}
.cal-d.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cal-d.pair{background:var(--accent-soft);border-color:var(--accent-soft-2);color:var(--accent-ink)}
.cal-d .dots{display:flex;gap:2px;margin-top:3px;height:4px}
.cal-d .dots i{width:4px;height:4px;border-radius:50%;display:block}
.cal-d.sel .dots i{background:rgba(255,255,255,.85)!important}
.cal-d .done{position:absolute;top:3px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.cal-d .done svg{width:8px;height:8px;stroke-width:3}
.cal-d.sel .done{background:#fff;color:var(--accent)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.wk-strip{display:none;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wk-strip::-webkit-scrollbar{display:none}
.wk-strip button{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.wk-strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wk-strip button i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.wk-strip button[aria-pressed="true"] i{background:#fff}
.ftog{display:none}

/* Filters */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;color:var(--ink-2);transition:all .12s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"] i{outline:2px solid rgba(255,255,255,.5)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--ink-2)}
.toggle-row+.toggle-row{border-top:1px solid var(--line)}
.sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line-2);transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
.link-btn{font-size:12px;color:var(--accent);font-weight:500}
.link-btn:hover{text-decoration:underline}

/* ── Main ────────────────────────────────────────────────── */
.main{min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-h h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.page-h .sub{color:var(--ink-3);font-size:13px;margin-top:4px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.stat.ok{background:var(--accent-soft);border-color:var(--accent-soft-2);color:var(--accent-ink)}
.stat.ok b{color:var(--accent-ink)}

.day{margin-bottom:32px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.day-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.day-h .date{color:var(--ink-3);font-size:13px}
.day-h .n{margin-left:auto;font-size:12px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.more{display:flex;justify-content:center;margin-top:14px}

/* Card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s,border-color .18s;cursor:pointer}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--line-2)}
.card.passed{opacity:.55}
.card.passed:hover{opacity:1}
.card.done{border-color:var(--accent-soft-2)}
.media{position:relative;aspect-ratio:16/9;background:var(--ph,var(--surface-2));overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.9}
.media .ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:14px 14px;opacity:.5}
.media .ph span{position:relative;filter:saturate(.9)}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:var(--ink);box-shadow:var(--shadow-sm);letter-spacing:.01em}
.badge i{width:6px;height:6px;border-radius:50%;display:inline-block}
.badge.free{background:var(--accent);color:#fff}
.badge.done{background:var(--accent);color:#fff}
.badge.done svg{width:12px;height:12px;stroke-width:3}
.body{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.meta{display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:12.5px}
.meta div{display:flex;align-items:center;gap:7px;min-width:0}
.meta svg{color:var(--ink-3);width:14px;height:14px}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{color:var(--ink-2);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rx span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.rx span.j{border-color:var(--jeff-soft);background:var(--jeff-soft);color:var(--jeff)}
.rx span.t{border-color:var(--tania-soft);background:var(--tania-soft);color:var(--tania)}
.foot{display:flex;align-items:center;gap:4px;padding:10px 12px;overflow:hidden;border-top:1px solid var(--line);background:var(--surface-2)}
.vb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;min-width:30px;padding:0 7px;flex:none;border-radius:8px;border:1px solid transparent;color:var(--ink-3);font-size:12px;font-weight:500;transition:all .12s}
.vb:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.vb.on.up{background:var(--accent-soft);border-color:var(--accent-soft-2);color:var(--accent-ink)}
.vb.on.dn{background:var(--danger-soft);border-color:#F3C9C4;color:var(--danger)}
.vb.on.sk{background:var(--amber-soft);border-color:#F1DDA8;color:var(--amber)}
.vb.on.dd{background:var(--ink);border-color:var(--ink);color:#fff}
.other{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3);flex:none}
.other .av{width:16px;height:16px;font-size:9px}
.other .st{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.other .st svg{width:11px;height:11px}
.other .st.up{color:var(--accent);border-color:var(--accent-soft-2);background:var(--accent-soft)}
.other .st.dn{color:var(--danger);border-color:#F3C9C4;background:var(--danger-soft)}
.other .st.sk{color:var(--amber);border-color:#F1DDA8;background:var(--amber-soft)}

.empty{padding:48px 24px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg)}
.empty h3{color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px}

/* ── Drawer ──────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(23,25,30,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:70;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:none}
.dr-top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;z-index:1}
.dr-top .kicker{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.dr-body{overflow-y:auto;flex:1}
.dr-media{aspect-ratio:2/1;position:relative;background:var(--ph,var(--surface-2))}
.dr-media img{width:100%;height:100%;object-fit:cover;display:block}
.dr-media .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:64px}
.dr-sec{padding:20px 24px;border-bottom:1px solid var(--line)}
.dr-sec:last-child{border-bottom:0}
.dr-sec h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin:6px 0 10px}
.dr-sec h4{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.dr-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;color:var(--ink-2);align-items:center}
.dr-meta svg{color:var(--ink-3)}
.dr-desc{font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:14px}
.dr-src{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:500;text-decoration:none}
.dr-src:hover{text-decoration:underline}
.person{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2)}
.person+.person{margin-top:10px}
.person.me{background:#fff;border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.person-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.person-h b{font-size:13px;font-weight:600}
.person-h .you{font-size:11px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
.vrow{display:flex;gap:6px;flex-wrap:wrap}
.vrow .vb{background:#fff;border-color:var(--line);height:34px;padding:0 12px}
.trow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink-2);transition:all .12s}
.tg:hover{border-color:var(--line-2);color:var(--ink)}
.tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tg.on.j{background:var(--jeff);border-color:var(--jeff)}
.tg.on.t{background:var(--tania);border-color:var(--tania)}
.did-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.did-row p{font-size:13px;color:var(--ink-2)}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical;line-height:1.5;font-size:13px}
textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-3)}

/* ── Modal ───────────────────────────────────────────────── */
.modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:80;opacity:0;pointer-events:none;transition:opacity .15s}
.modal.open{opacity:1;pointer-events:auto}
.modal-c{width:min(560px,100%);background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
.modal-h{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal-b{padding:16px 22px 22px;display:grid;gap:14px}
.f{display:grid;gap:6px}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f input,.f select{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.f input:focus,.f select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}

/* ── Insights ────────────────────────────────────────────── */
.ins-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.ins-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.list{display:flex;flex-direction:column}

.list a:last-child{border-bottom:0}

.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .d{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
.bar .n{width:88px;color:var(--ink-2);flex:none}

.bar .c{width:24px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.note-box{background:var(--accent-soft);border:1px solid var(--accent-soft-2);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--accent-ink);line-height:1.55;margin-top:16px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .2s;z-index:100;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}

  car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  up:'<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
  down:'<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
  skip:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  spark:'<path d="M9.9 2.7a1 1 0 0 1 1.9 0l1.3 4a1 1 0 0 0 .6.6l4 1.3a1 1 0 0 1 0 1.9l-4 1.3a1 1 0 0 0-.6.6l-1.3 4a1 1 0 0 1-1.9 0l-1.3-4a1 1 0 0 0-.6-.6l-4-1.3a1 1 0 0 1 0-1.9l4-1.3a1 1 0 0 0 .6-.6Z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
};
const I=(k,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cat=k=>CAT[k]||CAT.special;

// ── STATE ───────────────────────────────────────────────────
let votes={},custom=[],who='jeff',view='weekend',selected=WKND_DATES[0],q='';
function nextWknd(){const t=new Date();const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');for(let i=0;i<WKND_DATES.length;i+=2){if(WKND_DATES[i+1]>=iso)return WKND_DATES[i]}return WKND_DATES[WKND_DATES.length-2]}
let filters={cats:new Set(),free:false,indoor:false,near:false,hidePassed:false};
let expanded=new Set(),calMonth=null,openId=null,noteTimer=null;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function load(){
  votes=LS.get('mia_v4',{});custom=LS.get('mia_cx',[]);
  who=LS.get('mia_who','jeff');if(!PEOPLE[who])who='jeff';
  selected=LS.get('mia_sel',null);if(!selected||!PAIR[selected])selected=nextWknd();
  const f=LS.get('mia_f',null);if(f){filters.free=!!f.free;filters.indoor=!!f.indoor;filters.near=!!f.near;filters.hidePassed=!!f.hidePassed;filters.cats=new Set(f.cats||[])}
}
const saveVotes=()=>LS.set('mia_v4',votes);
const saveCustom=()=>LS.set('mia_cx',custom);
const saveFilters=()=>LS.set('mia_f',{free:filters.free,indoor:filters.indoor,near:filters.near,hidePassed:filters.hidePassed,cats:[...filters.cats]});
const all=()=>[...ACTIVITIES,...custom];
const byId=id=>all().find(a=>a.id===id);
const V=id=>votes[id]||{};
const vote=(id,p)=>V(id)[p]||0;
const skip=(id,p)=>!!V(id)[p+'Skip'];
const tags=(id,p)=>V(id)[p+'Tags']||[];
const note=id=>V(id).notes||'';
const did=id=>!!V(id).didIt;
const ens=id=>{if(!votes[id])votes[id]={};return votes[id]};
const other=p=>p==='jeff'?'tania':'jeff';
const passed=id=>vote(id,'jeff')<0||vote(id,'tania')<0;
const loved=id=>vote(id,'jeff')>0&&vote(id,'tania')>0;
const shortlisted=id=>(vote(id,'jeff')>0||vote(id,'tania')>0)&&!passed(id);

// ── DATE HELPERS ────────────────────────────────────────────
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=(s,o)=>D(s).toLocaleDateString('en-US',o);
const dayName=s=>fmt(s,{weekday:'long'});
const shortDate=s=>fmt(s,{month:'short',day:'numeric'});
const longDate=s=>fmt(s,{month:'long',day:'numeric'});
const wkOf=s=>{const sat=D(s).getDay()===6?s:PAIR[s];const sun=PAIR[sat];return{sat,sun}};
const monthKey=s=>s.slice(0,7);
const MONTHS=[...new Set(WKND_DATES.map(monthKey))];

// ── MUTATIONS ───────────────────────────────────────────────
function setVote(id,p,val){const v=ens(id);v[p]=v[p]===val?0:val;if(v[p]!==0)v[p+'Skip']=false;saveVotes();push({votes:{[id]:{[p]:v[p],[p+'Skip']:!!v[p+'Skip']}}});rerender()}
function setSkip(id,p){const v=ens(id);v[p+'Skip']=!v[p+'Skip'];if(v[p+'Skip'])v[p]=0;saveVotes();push({votes:{[id]:{[p]:v[p]||0,[p+'Skip']:v[p+'Skip']}}});rerender()}
function toggleTag(id,p,k){const v=ens(id);const t=new Set(v[p+'Tags']||[]);t.has(k)?t.delete(k):t.add(k);v[p+'Tags']=[...t];saveVotes();push({votes:{[id]:{[p+'Tags']:v[p+'Tags']}}});rerender()}
function toggleDid(id){const v=ens(id);v.didIt=!v.didIt;saveVotes();push({votes:{[id]:{didIt:v.didIt}}});rerender();toast(v.didIt?'Marked as done':'Unmarked')}
function setNote(id,text){ens(id).notes=text;saveVotes();push({votes:{[id]:{notes:text}}})}
function removeCustom(id){custom=custom.filter(a=>a.id!==id);delete votes[id];saveCustom();saveVotes();push({removeCustom:id});closeDrawer();rerender();toast('Idea removed')}

// ── FILTERING ───────────────────────────────────────────────
function matches(a){
  if(filters.cats.size&&!filters.cats.has(a.category))return false;
  if(filters.free&&!a.tags.includes('free'))return false;
  if(filters.indoor&&!a.tags.includes('indoor'))return false;
  if(filters.near){const m=/(\d+)\s*min/.exec(a.distance||'');if(!m||+m[1]>30)return false}
  if(filters.hidePassed&&passed(a.id))return false;
  if(q){const s=(a.title+' '+a.desc+' '+a.location+' '+a.source+' '+cat(a.category).n).toLowerCase();if(!s.includes(q))return false}
  return true;
}
const forDay=d=>all().filter(a=>a.day===d);
const filtersActive=()=>filters.cats.size||filters.free||filters.indoor||filters.near||filters.hidePassed||q;

// ── RENDER: CALENDAR ────────────────────────────────────────
function renderCal(){
  if(!calMonth)calMonth=monthKey(selected);
  const idx=MONTHS.indexOf(calMonth);
  const[y,m]=calMonth.split('-').map(Number);
  document.getElementById('calTitle').textContent=new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('calPrev').disabled=idx<=0;
  document.getElementById('calNext').disabled=idx>=MONTHS.length-1;
  const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  const {sat,sun}=wkOf(selected);
  let h=['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(y,m-1,d).getDay();const wk=dow===0||dow===6;const has=!!PAIR[ds];
    const acts=has?forDay(ds):[];
    const cats=[...new Set(acts.map(a=>a.category))].slice(0,3);
    const isDone=acts.some(a=>did(a.id));
    const cls=['cal-d',wk?'wk':'',has?'has':'',ds===selected?'sel':'',has&&ds!==selected&&(ds===sat||ds===sun)?'pair':''].filter(Boolean).join(' ');
    h+=`<div class="${cls}" ${has?`role="button" tabindex="0" data-date="${ds}" aria-label="${dayName(ds)} ${longDate(ds)}, ${acts.length} activities"`:''}>${d}${has?`<div class="dots">${cats.map(c=>`<i style="background:${cat(c).c}"></i>`).join('')}</div>`:''}${isDone?`<span class="done">${I('check')}</span>`:''}</div>`;
  }
  document.getElementById('cal').innerHTML=h;
  document.getElementById('wkStrip').innerHTML=WKND_DATES.filter((d,i)=>i%2===0).map(d=>`<button data-date="${d}" aria-pressed="${d===sat}"><i></i>${shortDate(d)}–${D(PAIR[d]).getDate()}</button>`).join('');
  document.querySelector('#wkStrip [aria-pressed="true"]')?.scrollIntoView({block:'nearest',inline:'center'});
  document.getElementById('calLegend').innerHTML=`<span><i style="background:var(--accent)"></i>Selected day</span><span><i style="background:var(--accent-soft-2)"></i>Same weekend</span><span><i style="background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--accent)"></i>We went</span>`;
}
function renderFilterUI(){
  document.getElementById('catChips').innerHTML=Object.entries(CAT).map(([k,c])=>`<button class="chip" data-cat="${k}" aria-pressed="${filters.cats.has(k)}"><i style="background:${c.c}"></i>${c.n}</button>`).join('');
  document.querySelectorAll('[data-tf]').forEach(b=>b.setAttribute('aria-checked',String(!!filters[b.dataset.tf])));
}

// ── RENDER: CARD ────────────────────────────────────────────
function media(a,cls='media'){
  const c=cat(a.category);
  return`<div class="${cls}" style="--ph:${c.bg}"><div class="ph"><span>${c.e}</span></div>${a.imageUrl?`<img src="${esc(a.imageUrl)}" alt="" loading="lazy" style="position:relative" onerror="this.remove()">`:''}</div>`;
}
function stIcon(id,p){
  const v=vote(id,p),s=skip(id,p);
  if(v>0)return`<span class="st up" title="${PEOPLE[p].n}: thumbs up">${I('up')}</span>`;
  if(v<0)return`<span class="st dn" title="${PEOPLE[p].n}: pass">${I('down')}</span>`;
  if(s)return`<span class="st sk" title="${PEOPLE[p].n}: not this weekend">${I('skip')}</span>`;
  return`<span class="st" title="${PEOPLE[p].n}: no vote yet"></span>`;
}
function rxChips(id){
  const out=[];
  for(const p of ['jeff','tania'])for(const k of tags(id,p)){const t=RTAGS.find(t=>t.k===k);if(t)out.push(`<span class="${PEOPLE[p].k}" title="${PEOPLE[p].n}">${esc(t.l)}</span>`)}
  if(note(id))out.push(`<span title="${esc(note(id))}">Note</span>`);
  return out.length?`<div class="rx">${out.slice(0,4).join('')}${out.length>4?`<span>+${out.length-4}</span>`:''}</div>`:'';
}
function card(a){
  const c=cat(a.category),id=a.id,me=who,v=vote(id,me),s=skip(id,me),dn=did(id);
  const free=a.tags.includes('free');
  return`<article class="card${passed(id)?' passed':''}${dn?' done':''}" data-open="${id}" tabindex="0" aria-label="${esc(a.title)}">
    ${media(a)}
    <div class="badges"><span class="badge"><i style="background:${c.c}"></i>${c.n}</span>${dn?`<span class="badge done">${I('check')}Went</span>`:free?`<span class="badge free">Free</span>`:''}</div>
    <div class="body">
      <h3 class="title">${esc(a.title)}</h3>
      <div class="meta">
        <div>${I('clock')}<span>${esc(a.timing)}</span></div>
        <div>${I('pin')}<span>${esc(a.location)}</span></div>
        ${a.distance?`<div>${I('car')}<span>${esc(a.distance)} from home</span></div>`:''}
      </div>
      <p class="desc">${esc(a.desc)}</p>
      ${rxChips(id)}
    </div>
    <div class="foot">
      <button class="vb up${v>0?' on':''}" data-vote="1" data-id="${id}" title="Thumbs up" aria-pressed="${v>0}">${I('up')}</button>
      <button class="vb dn${v<0?' on':''}" data-vote="-1" data-id="${id}" title="Pass" aria-pressed="${v<0}">${I('down')}</button>
      <button class="vb sk${s?' on':''}" data-skip="${id}" title="Like it, not this weekend" aria-pressed="${s}">${I('skip')}<span>Not now</span></button>
      <button class="vb dd${dn?' on':''}" data-did="${id}" title="We did this" aria-pressed="${dn}">${I('check')}<span>${dn?'Went':'Did it'}</span></button>
      <span class="other" title="${PEOPLE[other(me)].n}"><span class="av ${PEOPLE[other(me)].k}">${PEOPLE[other(me)].n[0]}</span>${stIcon(id,other(me))}</span>
    </div>
  </article>`;
}

// ── RENDER: VIEWS ───────────────────────────────────────────
function daySection(d,list,label,showAll){
  const sorted=list;
  const open=showAll||expanded.has(d);
  const shown=open?sorted:sorted.slice(0,MAX_SHOWN);
  const extra=sorted.length-shown.length;
  return`<section class="day">
    <div class="day-h"><h2>${label||dayName(d)}</h2><span class="date">${longDate(d)}</span><span class="n">${sorted.length} ${sorted.length===1?'pick':'picks'}</span></div>
    ${shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:`<div class="empty"><h3>Nothing matches here</h3>Try clearing a filter or two.</div>`}
    ${extra>0?`<div class="more"><button class="btn" data-expand="${d}">Show ${extra} more</button></div>`:open&&sorted.length>MAX_SHOWN?`<div class="more"><button class="btn ghost" data-collapse="${d}">Show fewer</button></div>`:''}
  </section>`;
}
function weekendView(){
  const{sat,sun}=wkOf(selected);
  const s1=forDay(sat).filter(matches),s2=forDay(sun).filter(matches);
  const both=[...forDay(sat),...forDay(sun)];
  const nShort=both.filter(a=>shortlisted(a.id)).length,nLove=both.filter(a=>loved(a.id)).length,nDone=both.filter(a=>did(a.id)).length,nUnvoted=both.filter(a=>!vote(a.id,who)&&!skip(a.id,who)).length;
  return`<div class="page-h"><div><h1>Weekend of ${longDate(sat)}–${D(sun).getDate()}</h1><p class="sub">${both.length} ideas · ${nUnvoted?`${nUnvoted} still waiting on your vote, ${PEOPLE[who].n}`:'you\'ve weighed in on everything'}</p></div>
    <div class="stat-row">${nLove?`<span class="stat ok">${I('spark')}<b>${nLove}</b> both love</span>`:''}<span class="stat"><b>${nShort}</b> shortlisted</span>${nDone?`<span class="stat"><b>${nDone}</b> done</span>`:''}</div></div>
    ${daySection(sat,s1)}${daySection(sun,s2)}`;
}
function groupedView(title,sub,pred,emptyH,emptyP){
  const list=all().filter(a=>pred(a.id)&&matches(a));
  const days=WKND_DATES.filter(d=>list.some(a=>a.day===d));
  return`<div class="page-h"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="stat-row"><span class="stat"><b>${list.length}</b> ${list.length===1?'activity':'activities'}</span></div></div>
    ${days.length?days.map(d=>daySection(d,list.filter(a=>a.day===d),dayName(d),true)).join(''):`<div class="empty"><h3>${emptyH}</h3>${emptyP}</div>`}`;
}
function insightsView(){
  const A=all(),vt=A.filter(a=>votes[a.id]&&(vote(a.id,'jeff')||vote(a.id,'tania')));
  const love=A.filter(a=>loved(a.id)),pass=A.filter(a=>vote(a.id,'jeff')<0&&vote(a.id,'tania')<0),split=A.filter(a=>(vote(a.id,'jeff')>0&&vote(a.id,'tania')<0)||(vote(a.id,'jeff')<0&&vote(a.id,'tania')>0)),done=A.filter(a=>did(a.id));
  const catScore={};for(const a of A){const j=vote(a.id,'jeff'),t=vote(a.id,'tania');if(!j&&!t)continue;catScore[a.category]=catScore[a.category]||{up:0,n:0};catScore[a.category].n++;if(j>0)catScore[a.category].up++;if(t>0)catScore[a.category].up++}
  const catRows=Object.entries(catScore).map(([k,s])=>({k,pct:Math.round(100*s.up/(2*s.n)),n:s.n})).sort((a,b)=>b.pct-a.pct);
  const tagCount={};for(const a of A)for(const p of['jeff','tania'])for(const k of tags(a.id,p)){tagCount[k]=tagCount[k]||{jeff:0,tania:0};tagCount[k][p]++}
  const tagRows=Object.entries(tagCount).map(([k,c])=>({k,l:(RTAGS.find(t=>t.k===k)||{}).l||k,jeff:c.jeff,tania:c.tania,tot:c.jeff+c.tania})).sort((a,b)=>b.tot-a.tot);
  const maxTag=Math.max(1,...tagRows.map(r=>r.tot));
  const li=a=>`<a data-open="${a.id}"><i style="width:8px;height:8px;border-radius:50%;background:${cat(a.category).c};flex:none"></i><span class="t">${esc(a.title)}</span><span class="d">${shortDate(a.day)}</span></a>`;
  const list=(arr,empty)=>arr.length?`<div class="list">${arr.slice(0,8).map(li).join('')}</div>`:`<p style="font-size:13px;color:var(--ink-3);padding:6px 0">${empty}</p>`;
  return`<div class="page-h"><div><h1>What we're learning</h1><p class="sub">Every vote, skip, reaction and "we went" feeds the Monday scan so next week's picks fit better.</p></div></div>
    <div class="ins-grid">
      <div class="kpi"><div class="v">${vt.length}<span style="font-size:14px;color:var(--ink-3);font-weight:500"> / ${A.length}</span></div><div class="l">Ideas with a vote</div></div>
      <div class="kpi"><div class="v" style="color:var(--accent)">${love.length}</div><div class="l">Both thumbs up</div></div>
      <div class="kpi"><div class="v">${split.length}</div><div class="l">Split decisions</div></div>
      <div class="kpi"><div class="v">${done.length}</div><div class="l">Actually went</div></div>
    </div>
    <div class="ins-2">
      <section class="panel"><div class="panel-h"><h3>Both of you love</h3></div><div class="panel-b">${list(love,'Nothing yet. When you both thumbs-up something, it shows here.')}</div></section>
      <section class="panel"><div class="panel-h"><h3>Where you disagree</h3></div><div class="panel-b">${list(split,'No split decisions so far.')}</div></section>
      <section class="panel"><div class="panel-h"><h3>Category appeal</h3></div><div class="panel-b">${catRows.length?catRows.map(r=>`<div class="bar"><span class="n">${cat(r.k).n}</span><div class="tr"><div class="fl" style="width:${r.pct}%;background:${cat(r.k).c}"></div></div><span class="c">${r.pct}%</span></div>`).join(''):'<p style="font-size:13px;color:var(--ink-3);padding:6px 0">Vote on a few activities to see which categories land.</p>'}</div></section>
      <section class="panel"><div class="panel-h"><h3>Reactions</h3></div><div class="panel-b">${tagRows.length?tagRows.map(r=>`<div class="bar"><span class="n">${esc(r.l)}</span><div class="tr" style="display:flex;gap:1px"><div class="fl" style="width:${100*r.jeff/maxTag}%;background:var(--jeff)"></div><div class="fl" style="width:${100*r.tania/maxTag}%;background:var(--tania)"></div></div><span class="c">${r.tot}</span></div>`).join('')+`<div style="display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--ink-3)"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--jeff);margin-right:4px"></i>Jeff</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--tania);margin-right:4px"></i>Tania</span></div>`:'<p style="font-size:13px;color:var(--ink-3);padding:6px 0">Open any activity to add reactions like "Book ahead" or "Too far".</p>'}</div></section>
      <section class="panel"><div class="panel-h"><h3>Passed on together</h3></div><div class="panel-b">${list(pass,'Nothing you both passed on.')}</div></section>
      <section class="panel"><div class="panel-h"><h3>We went</h3></div><div class="panel-b">${list(done,'Mark activities as done after the weekend to build Mia\'s highlight reel.')}</div></section>
    </div>
    <div class="note-box">${I('spark')} The Monday 9am scan reads this page: it favors categories you both rate highly, drops ideas tagged "Too far" or "Too pricey" by both of you, revives "Not now" picks on later weekends, and skips anything you've already done.</div>`;
}
function renderMain(){
  const el=document.getElementById('main');
  if(view==='weekend')el.innerHTML=weekendView();
  else if(view==='shortlist')el.innerHTML=groupedView('Shortlist','Anything with at least one thumbs up and no pass.',shortlisted,'No shortlist yet','Thumbs-up a few ideas on the Weekend tab and they\'ll collect here.');
  else if(view==='done')el.innerHTML=groupedView('We went','Your family highlight reel.',did,'Nothing marked yet','After a weekend, hit "Did it" on the activities you actually made it to.');
  else el.innerHTML=insightsView();
}
function rerender(){renderCal();renderMain();if(openId)renderDrawer(openId,true)}

// ── DRAWER ──────────────────────────────────────────────────
function personBlock(a,p){
  const id=a.id,v=vote(id,p),s=skip(id,p),me=p===who,P=PEOPLE[p],tg=tags(id,p);
  return`<div class="person${me?' me':''}"><div class="person-h"><span class="av ${P.k}">${P.n[0]}</span><b>${P.n}</b>${me?'<span class="you">you</span>':''}</div>
    <div class="vrow">
      <button class="vb up${v>0?' on':''}" data-vote="1" data-id="${id}" data-p="${p}" aria-pressed="${v>0}">${I('up')}Thumbs up</button>
      <button class="vb dn${v<0?' on':''}" data-vote="-1" data-id="${id}" data-p="${p}" aria-pressed="${v<0}">${I('down')}Pass</button>
      <button class="vb sk${s?' on':''}" data-skip="${id}" data-p="${p}" aria-pressed="${s}">${I('skip')}Not this weekend</button>
    </div>
    <div class="trow">${RTAGS.map(t=>`<button class="tg ${P.k}${tg.includes(t.k)?' on':''}" data-tag="${t.k}" data-id="${id}" data-p="${p}" aria-pressed="${tg.includes(t.k)}">${esc(t.l)}</button>`).join('')}</div>
  </div>`;
}
function renderDrawer(id,keepScroll){
  const a=byId(id);if(!a)return closeDrawer();
  const dr=document.getElementById('drawer'),c=cat(a.category),top=keepScroll?dr.querySelector('.dr-body')?.scrollTop:0;
  const noteEl=dr.querySelector('#noteTa');const noteVal=noteEl?noteEl.value:note(id);const noteFocused=noteEl&&document.activeElement===noteEl;
  if(noteFocused)return; // don't clobber typing
  dr.innerHTML=`<div class="dr-top"><span class="kicker"><span class="badge"><i style="background:${c.c}"></i>${c.n}</span>${dayName(a.day)}, ${longDate(a.day)}</span><button class="icon-btn" data-close aria-label="Close">${I('x')}</button></div>
  <div class="dr-body">
    ${media(a,'dr-media')}
    <div class="dr-sec">
      <h2>${esc(a.title)}</h2>
      <div class="dr-meta">${I('clock')}<span>${esc(a.timing)}</span>${I('pin')}<span>${esc(a.location)}</span>${a.distance?`${I('car')}<span>${esc(a.distance)} from Downtown Brooklyn</span>`:''}</div>
      <p class="dr-desc">${esc(a.desc)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${a.tags.map(t=>`<span class="stat" style="height:24px;font-size:11px">${esc(t.replace('-',' '))}</span>`).join('')}</div>
      ${a.sourceUrl?`<a class="dr-src" href="${esc(a.sourceUrl)}" target="_blank" rel="noopener">${esc(a.source||'Source')}${I('ext')}</a>`:''}
    </div>
    <div class="dr-sec"><h4>Votes &amp; reactions</h4>${personBlock(a,who)}${personBlock(a,other(who))}</div>
    <div class="dr-sec"><div class="did-row"><div><h4 style="margin-bottom:4px">Did we go?</h4><p>${did(id)?'Marked as done. It\'ll show in your highlight reel.':'Mark it after the weekend so the scan learns from it.'}</p></div><button class="vb dd${did(id)?' on':''}" data-did="${id}" style="height:36px;padding:0 14px;border-color:var(--line);background:${did(id)?'':'#fff'}">${I('check')}${did(id)?'We went':'Did it'}</button></div></div>
    <div class="dr-sec"><h4>Shared notes</h4><textarea id="noteTa" data-note="${id}" placeholder="Anything worth remembering: parking, nap timing, who to bring…">${esc(noteVal)}</textarea><div class="note-foot"><span id="noteStatus">Saves automatically</span>${a.custom?`<button class="btn sm danger" data-remove="${id}">${I('trash')}Remove idea</button>`:''}</div></div>
  </div>`;
  if(keepScroll&&top)dr.querySelector('.dr-body').scrollTop=top;
}
function openDrawer(id){openId=id;renderDrawer(id);document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('#drawer [data-close]')?.focus(),50)}
function closeDrawer(){openId=null;document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');document.body.style.overflow=''}

// ── MODAL ───────────────────────────────────────────────────
let mTags=new Set();
function buildAddForm(){document.querySelector('#modal .modal-c').innerHTML=ADD_FORM}
function openModal(){
  buildAddForm();
  document.getElementById('mDate').innerHTML=WKND_DATES.map(d=>`<option value="${d}"${d===selected?' selected':''}>${dayName(d)}, ${longDate(d)}</option>`).join('');
  document.getElementById('mCat').innerHTML=Object.entries(CAT).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('');
  mTags=new Set(['toddler-friendly']);renderMTags();
  ['mTitle','mDesc','mTiming','mDist','mLoc','mUrl'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('mTitle').focus(),50);
}
function renderMTags(){document.getElementById('mTags').innerHTML=['free','outdoor','indoor','daytrip','toddler-friendly'].map(t=>`<button class="chip" data-mtag="${t}" aria-pressed="${mTags.has(t)}">${t.replace('-',' ')}</button>`).join('')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveModal(){
  const g=i=>document.getElementById(i).value.trim();
  if(!g('mTitle'))return toast('Give it a title first'),document.getElementById('mTitle').focus();
  const a={id:'c'+Date.now(),title:g('mTitle'),desc:g('mDesc'),timing:g('mTiming')||'Flexible',location:g('mLoc')||'TBD',distance:g('mDist'),source:'Added by '+PEOPLE[who].n,sourceUrl:g('mUrl'),imageUrl:'',day:g('mDate'),category:g('mCat'),tags:[...mTags],custom:true};
  custom.push(a);saveCustom();push({custom:[a]});closeModal();selected=a.day;LS.set('mia_sel',selected);calMonth=monthKey(selected);expanded.add(a.day);view='weekend';syncSeg();rerender();toast('Added to the weekend');
}

// ── SHARED SYNC (Google Apps Script backend) ────────────────
// Set SYNC_URL to the deployed web-app URL, or paste it in the Sync dialog.
const SYNC_URL='';
let syncUrl=SYNC_URL||LS.get('mia_sync','');
let pending=LS.get('mia_pending',[]),syncing=false,lastSync=LS.get('mia_lastsync',0),syncErr='',pollT=null;
function setSyncUI(state,label){const d=document.getElementById('syncDot'),l=document.getElementById('syncLabel');if(!d)return;d.className='sdot'+(state?' '+state:'');l.textContent=label}
function refreshSyncUI(){
  if(!syncUrl)return setSyncUI('','Local only');
  if(syncing)return setSyncUI('busy','Syncing…');
  if(syncErr)return setSyncUI('err','Sync error');
  if(pending.length)return setSyncUI('busy',`${pending.length} pending`);
  const ago=lastSync?Math.round((Date.now()-lastSync)/60000):null;
  setSyncUI('ok',ago===null?'Shared':ago<1?'Synced just now':ago<60?`Synced ${ago}m ago`:'Synced');
}
function applyPatch(target,body){
  for(const[id,patch]of Object.entries(body.votes||{})){target[id]=Object.assign(target[id]||{},patch)}
}
function push(body){
  if(!syncUrl)return;
  pending.push(body);LS.set('mia_pending',pending);refreshSyncUI();
  clearTimeout(push.t);push.t=setTimeout(flush,400);
}
async function flush(){
  if(!syncUrl||syncing||!pending.length)return;
  syncing=true;refreshSyncUI();
  const batch={votes:{},custom:[],removeCustom:[]};
  for(const b of pending){applyPatch(batch.votes,b);if(b.custom)batch.custom.push(...b.custom);if(b.removeCustom)batch.removeCustom.push(b.removeCustom)}
  try{
    const r=await fetch(syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(batch)});
    const data=await r.json();if(!data||!data.votes)throw new Error('bad response');
    pending=[];LS.set('mia_pending',pending);syncErr='';adopt(data);
  }catch(e){syncErr=String(e.message||e)}
  syncing=false;lastSync=syncErr?lastSync:Date.now();LS.set('mia_lastsync',lastSync);refreshSyncUI();
}
function adopt(data){
  // server state wins, then re-apply anything still pending locally
  const merged={};for(const[id,v]of Object.entries(data.votes||{}))merged[id]=Object.assign({},v);
  for(const b of pending)applyPatch(merged,b);
  const before=JSON.stringify(votes),beforeC=JSON.stringify(custom);
  votes=merged;
  const remoteCustom=Array.isArray(data.custom)?data.custom:[];
  const localOnly=custom.filter(c=>pending.some(b=>(b.custom||[]).some(x=>x.id===c.id)));
  custom=[...remoteCustom,...localOnly.filter(c=>!remoteCustom.some(r=>r.id===c.id))];
  saveVotes();saveCustom();
  if(before!==JSON.stringify(votes)||beforeC!==JSON.stringify(custom))rerender();
}
async function pull(){
  if(!syncUrl||syncing)return;
  syncing=true;refreshSyncUI();
  try{const r=await fetch(syncUrl,{method:'GET'});const data=await r.json();if(!data||!data.votes)throw new Error('bad response');syncErr='';adopt(data);lastSync=Date.now();LS.set('mia_lastsync',lastSync)}
  catch(e){syncErr=String(e.message||e)}
  syncing=false;refreshSyncUI();
  if(pending.length)flush();
}
function startSync(){
  clearInterval(pollT);if(!syncUrl){refreshSyncUI();return}
  pull();pollT=setInterval(()=>{if(document.visibilityState==='visible')pull()},20000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncUrl)pull()});
window.addEventListener('online',()=>{if(syncUrl)pull()});

// first-time bootstrap: if the server is empty and this device has votes, seed it
async function seedIfEmpty(data){
  if(Object.keys(data.votes||{}).length===0&&Object.keys(votes).length){push({votes:votes,custom:custom})}
}

const APPS_SCRIPT=`// Mia's Weekends — shared vote store
// 1) In a new Google Sheet: Extensions → Apps Script. Replace everything with this file.
// 2) Deploy → New deployment → Web app. Execute as: Me. Who has access: Anyone. Deploy.
// 3) Copy the Web app URL and paste it into the Sync dialog on the site.
function sheet_(){return SpreadsheetApp.getActiveSpreadsheet().getSheets()[0]}
function load_(){const rows=sheet_().getDataRange().getValues();const st={votes:{},custom:[]};
  for(const r of rows){if(!r[0]||r[0]==='id')continue;try{if(r[0]==='__custom')st.custom=JSON.parse(r[1]);else st.votes[r[0]]=JSON.parse(r[1])}catch(e){}}return st}
function save_(st){const sh=sheet_();const rows=[['id','json','updated']];const now=new Date();
  for(const id in st.votes)rows.push([id,JSON.stringify(st.votes[id]),now]);
  rows.push(['__custom',JSON.stringify(st.custom||[]),now]);
  sh.clearContents();sh.getRange(1,1,rows.length,3).setValues(rows)}
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function doGet(){return out_(load_())}
function doPost(e){const lock=LockService.getScriptLock();lock.waitLock(15000);
  try{const b=JSON.parse((e.postData&&e.postData.contents)||'{}');const st=load_();
    for(const id in (b.votes||{})){st.votes[id]=Object.assign(st.votes[id]||{},b.votes[id])}
    for(const a of (b.custom||[])){if(!st.custom.some(c=>c.id===a.id))st.custom.push(a)}
    for(const id of (b.removeCustom||[])){st.custom=st.custom.filter(c=>c.id!==id);delete st.votes[id]}
    save_(st);return out_(st)}
  finally{lock.releaseLock()}}`;

function openSync(){
  const m=document.getElementById('modal');
  m.querySelector('.modal-c').innerHTML=`<div class="modal-h"><h3>Shared votes</h3><button class="icon-btn" data-close-sync aria-label="Close">${I('x')}</button></div>
  <div class="modal-b">
    ${syncUrl?`<div class="kv"><span>Status</span><b id="syncStatusLine">${syncErr?'Error: '+esc(syncErr):'Connected'}</b><span>Last sync</span><b>${lastSync?new Date(lastSync).toLocaleString():'never'}</b><span>Pending</span><b>${pending.length} change${pending.length===1?'':'s'}</b></div>
    <div style="display:flex;gap:8px"><button class="btn sm" id="syncNow">Sync now</button><button class="btn sm danger" id="syncDisconnect">Disconnect</button></div>`
    :`<p style="font-size:13px;color:var(--ink-2);line-height:1.55">Right now votes save only on this device. Connect a shared store (a private Google Sheet you own) so you and ${PEOPLE[other(who)].n} see each other's votes live on any phone. Takes about three minutes, once.</p>
    <div class="steps"><div>Create a new Google Sheet, then open <b>&nbsp;Extensions → Apps Script</b>.</div><div>Replace the code with the script below and save.</div><div><b>Deploy → New deployment → Web app.</b> Execute as <b>Me</b>, access <b>Anyone</b>. Deploy and copy the Web app URL.</div><div>Paste that URL here.</div></div>
    <div class="f"><label>Apps Script code</label><textarea id="scriptCode" readonly style="min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">${esc(APPS_SCRIPT)}</textarea><div style="display:flex;justify-content:flex-end"><button class="btn sm" id="copyScript">Copy code</button></div></div>`}
    <div class="f"><label for="syncUrlIn">${syncUrl?'Web app URL':'Paste the Web app URL'}</label><input id="syncUrlIn" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncUrl)}"></div>
    <details style="font-size:12.5px;color:var(--ink-2)"><summary style="cursor:pointer;font-weight:500;color:var(--ink)">Offline fallback: swap a code</summary>
      <div class="f" style="margin-top:10px"><label>Your code (${PEOPLE[who].n})</label><textarea id="syncOut" readonly style="min-height:60px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">${exportCode()}</textarea><div style="display:flex;justify-content:flex-end"><button class="btn sm" id="syncCopy">Copy code</button></div></div>
      <div class="f" style="margin-top:8px"><label for="syncIn">Paste ${PEOPLE[other(who)].n}'s code</label><textarea id="syncIn" style="min-height:60px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px"></textarea><div style="display:flex;justify-content:flex-end"><button class="btn sm" id="syncMerge">Merge votes</button></div></div>
    </details>
    <div class="modal-f"><button class="btn" data-close-sync>Close</button><button class="btn primary" id="syncSave">${syncUrl?'Save':'Connect'}</button></div>
  </div>`;
  m.classList.add('open');
}
function closeSync(){document.getElementById('modal').classList.remove('open');setTimeout(buildAddForm,200)}
async function connectSync(url){
  url=url.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return toast('That doesn\'t look like an Apps Script URL');
  setSyncUI('busy','Connecting…');
  try{const r=await fetch(url);const data=await r.json();if(!data||typeof data!=='object'||!('votes'in data))throw new Error('unexpected response');
    syncUrl=url;LS.set('mia_sync',url);syncErr='';
    if(Object.keys(data.votes).length===0&&Object.keys(votes).length){push({votes:votes,custom:custom})}else adopt(data);
    lastSync=Date.now();LS.set('mia_lastsync',lastSync);startSync();closeSync();toast('Connected. Votes now sync live.');
  }catch(e){refreshSyncUI();toast('Could not reach that URL: '+(e.message||e))}
}
function exportCode(){const payload={v:2,who,at:Date.now(),votes,custom};return btoa(unescape(encodeURIComponent(JSON.stringify(payload))))}
function importCode(code){
  let p;try{p=JSON.parse(decodeURIComponent(escape(atob(code.trim()))))}catch(e){return toast('That code doesn\'t look right')}
  if(!p||!p.votes||!PEOPLE[p.who])return toast('That code doesn\'t look right');
  const src=p.who;let n=0;
  for(const[id,iv]of Object.entries(p.votes)){
    const v=ens(id);const patch={};
    for(const f of[src,src+'Skip',src+'Tags'])if(iv[f]!==undefined){v[f]=iv[f];patch[f]=iv[f];n++}
    if(iv.didIt){v.didIt=true;patch.didIt=true}
    if(iv.notes&&iv.notes!==v.notes){v.notes=v.notes?v.notes+'\n'+iv.notes:iv.notes;patch.notes=v.notes}
    if(Object.keys(patch).length)push({votes:{[id]:patch}});
  }
  for(const a of p.custom||[])if(!custom.some(c=>c.id===a.id)){custom.push(a);push({custom:[a]})}
  saveVotes();saveCustom();rerender();closeSync();toast(`Merged ${PEOPLE[src].n}'s votes (${n} updates)`);
}

// ── UI PLUMBING ─────────────────────────────────────────────
let toastT;function toast(m){const t=document.getElementById('toast');t.innerHTML=`${I('check')}${esc(m)}`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
function syncSeg(){document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('#whoSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.who===who)))}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open],[data-date]');if(!t)return;
  const d=t.dataset;
  if(d.vote!==undefined&&d.id){e.stopPropagation();return setVote(d.id,d.p||who,+d.vote)}
  if(d.skip){e.stopPropagation();return setSkip(d.skip,d.p||who)}
  if(d.did){e.stopPropagation();return toggleDid(d.did)}
  if(d.tag){e.stopPropagation();return toggleTag(d.id,d.p||who,d.tag)}
  if(d.remove){if(confirm('Remove this idea for everyone?'))removeCustom(d.remove);return}
  if(d.expand){expanded.add(d.expand);return renderMain()}
  if(d.collapse){expanded.delete(d.collapse);return renderMain()}
  if(d.open)return openDrawer(d.open);
  if(d.date){selected=d.date;LS.set('mia_sel',selected);view='weekend';syncSeg();return rerender()}
  if(d.view){view=d.view;syncSeg();window.scrollTo({top:0});return renderMain()}
  if(d.who){who=d.who;LS.set('mia_who',who);syncSeg();return rerender()}
  if(d.cat){filters.cats.has(d.cat)?filters.cats.delete(d.cat):filters.cats.add(d.cat);saveFilters();renderFilterUI();return renderMain()}
  if(d.tf){filters[d.tf]=!filters[d.tf];saveFilters();renderFilterUI();return renderMain()}
  if(d.mtag){mTags.has(d.mtag)?mTags.delete(d.mtag):mTags.add(d.mtag);return renderMTags()}
  if(t.hasAttribute('data-close'))return closeDrawer();
  if(t.id==='clearF'){filters={cats:new Set(),free:false,indoor:false,near:false,hidePassed:false};q='';document.getElementById('q').value='';saveFilters();renderFilterUI();return renderMain()}
  if(t.id==='calPrev'||t.id==='calNext'){const i=MONTHS.indexOf(calMonth)+(t.id==='calPrev'?-1:1);if(MONTHS[i]){calMonth=MONTHS[i];renderCal()}return}
  if(t.id==='addBtn')return openModal();
  if(t.id==='ftog'){const p=document.getElementById('filtersPanel');const o=p.classList.toggle('open');t.textContent=o?'Hide':'Show';t.setAttribute('aria-expanded',String(o));return}
  if(t.id==='syncBtn')return openSync();
  if(t.hasAttribute('data-close-sync'))return closeSync();
  if(t.id==='syncCopy'){const ta=document.getElementById('syncOut');ta.select();(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Code copied'),()=>{document.execCommand&&document.execCommand('copy');toast('Code selected, press Ctrl+C')});return}
  if(t.id==='syncMerge')return importCode(document.getElementById('syncIn').value);
  if(t.id==='syncSave')return connectSync(document.getElementById('syncUrlIn').value);
  if(t.id==='syncNow'){pull();return toast('Syncing…')}
  if(t.id==='syncDisconnect'){syncUrl='';LS.set('mia_sync','');pending=[];LS.set('mia_pending',[]);startSync();closeSync();return toast('Disconnected. Votes stay on this device.')}
  if(t.id==='copyScript'){const ta=document.getElementById('scriptCode');ta.select();(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Script copied'),()=>{document.execCommand&&document.execCommand('copy');toast('Selected, press Ctrl+C')});return}
  if(t.id==='modalClose'||t.id==='modalCancel')return closeModal();
  if(t.id==='modalSave')return saveModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('open'))return closeModal();if(openId)return closeDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open],[data-date]')&&!e.target.matches('button')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();renderMain()}
  if(e.target.dataset.note){const id=e.target.dataset.note,st=document.getElementById('noteStatus');st.textContent='Saving…';clearTimeout(noteTimer);noteTimer=setTimeout(()=>{setNote(id,e.target.value);st.textContent='Saved';renderMain()},500)}
});
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'){closeModal();setTimeout(buildAddForm,200)}});
const ADD_FORM=document.querySelector('#modal .modal-c').innerHTML;

// ── INIT ────────────────────────────────────────────────────
load();syncSeg();renderFilterUI();rerender();startSync();
</script>
